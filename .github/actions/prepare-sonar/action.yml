name: Prepare complete Sonar measurement
description: Prepare exact context, test dependencies and provenance for the complete suites.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.x'

    - name: every context the composed run claims is here
      shell: bash
      run: |
        set -euo pipefail
        missing=0
        for need in project.yaml contracts/code-pin.yaml contracts/spec-pin.yaml \
                    code/openRepoTools code/tests/run.sh code/tests/conftest.py \
                    code/contracts/openreposhape-pin.yaml \
                    code/upstream/openRepoShape/scripts/repo_shape.py \
                    code/upstream/openRepoShape/templates/workspace-root/README.md; do
          if [ ! -f "$need" ]; then
            echo "::error::the composed run needs $need, and this checkout has none"
            missing=1
          fi
        done
        if [ ! -d spec/openspec ] && [ ! -d spec/specs ] && [ ! -d spec/docs ]; then
          echo "::error::the spec leg is not checked out at spec/"
          missing=1
        fi
        git submodule status --recursive
        exit "$missing"

    # The same two the `validate` workflow runs, here as the gate's FIRST
    # half: a suite that passes at a gitlink the pin does not name passes
    # at the wrong commit.
    - name: the manifest and the lockstep pins
      shell: bash
      run: |
        python3 scripts/validate-manifest.py
        python3 scripts/validate-pins.py

    # Install zsh so conditional command and skill cases actually run.
    # The code leg's standalone CI intentionally lacks assembly/spec context;
    # this composed job supplies both and refuses absent pinned dependencies.
    # The remaining platform/wheel skips are printed by -rs. The code leg's
    # package job separately requires its built-wheel suite to pass with no
    # skips. Test counts evolve; do not turn an old comment into a skip budget.
    - name: install zsh, so the suite's zsh cases run
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends zsh jq cmake g++ make pkg-config \
          libcurl4-openssl-dev libdw-dev libelf-dev zlib1g-dev \
          binutils-dev libiberty-dev libssl-dev
        command -v zsh
        zsh --version

    - name: install the test runner
      shell: bash
      run: 'python3 -m pip install --disable-pip-version-check --only-binary=:all: pytest==8.3.4 coverage==7.17.3 git-filter-repo==2.47.0'

    - name: register exact provenance for isolated Python startup
      env:
        COVERAGE_PROCESS_START: ''
        COVERAGE_PROCESS_CONFIG: ''
      shell: bash
      run: |
        python3 - <<'PYINSTALL'
        import hashlib
        from pathlib import Path
        import subprocess
        import sys
        import sysconfig

        source = Path("code/.github/ci/sonar_coverage/provenance.py")
        target = Path(sysconfig.get_path("purelib")) / "provenance.py"
        payload = source.read_bytes()
        if target.is_symlink() or target.exists() and target.read_bytes() != payload:
            raise SystemExit("refusing to replace a different provenance module")
        if not target.exists():
            target.write_bytes(payload)
        expected = hashlib.sha256(payload).hexdigest()
        probe = (
            "import hashlib, provenance; from pathlib import Path; "
            "print(hashlib.sha256(Path(provenance.__file__).read_bytes()).hexdigest())"
        )
        actual = subprocess.check_output(
            [sys.executable, "-I", "-c", probe], text=True).strip()
        if actual != expected:
            raise SystemExit("isolated Python loaded different provenance bytes")
        print("isolated Python provenance sha256:", actual)
        PYINSTALL

    # Coverage tools and reports live outside the checkout. No installed
    # workstation command, lane record, session or shared bench is changed.
    - name: build the pinned shell denominator parser
      shell: bash
      run: |
        set -euo pipefail
        git init "$RUNNER_TEMP/kcov-source"
        git -C "$RUNNER_TEMP/kcov-source" remote add origin https://github.com/SimonKagstrom/kcov.git
        git -C "$RUNNER_TEMP/kcov-source" fetch --depth 1 origin refs/tags/v43:refs/tags/v43
        git -C "$RUNNER_TEMP/kcov-source" checkout --detach a39874f938ce13f7a65f253120d1ec946b349ffe
        test "$(git -C "$RUNNER_TEMP/kcov-source" rev-parse HEAD)" = a39874f938ce13f7a65f253120d1ec946b349ffe
        cmake -S "$RUNNER_TEMP/kcov-source" -B "$RUNNER_TEMP/kcov-build" -DCMAKE_BUILD_TYPE=Release
        cmake --build "$RUNNER_TEMP/kcov-build" --parallel 2
        "$RUNNER_TEMP/kcov-build/src/kcov" --version

    - name: inventory every exact source and prepare Python and shell measurement
      shell: bash
      run: |
        python3 code/.github/ci/sonar_assurance.py prepare --root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/sonar"
        python3 code/.github/ci/sonar_coverage.py prepare --root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/sonar"

    - name: git identity for the fixture commits (env, not global config)
      shell: bash
      run: |
        {
          echo "GIT_AUTHOR_NAME=openRepoTools CI"
          echo "GIT_AUTHOR_EMAIL=ci@openrepotools.invalid"
          echo "GIT_COMMITTER_NAME=openRepoTools CI"
          echo "GIT_COMMITTER_EMAIL=ci@openrepotools.invalid"
        } >> "$GITHUB_ENV"

