name: release

# ---------------------------------------------------------------------------
# PUBLISH THE openrepotools WHEEL (#228): TestPyPI, AN INSTALL CHECK ON THREE
# LEGS, THEN PyPI, IN ONE DISPATCHED RUN. Adapted step for step from
# openRepoShape v1.1.0's own release.yml (`190133d`, the commit
# `upstream/openRepoShape` is pinned at), whose checks are taken over as they
# are (FR-028) except where design.md Decision 10 names a difference:
#   - a pre-release `X.Y.ZrcN` is accepted, for TestPyPI alone; PyPI takes a
#     final `X.Y.Z` and nothing else;
#   - the repository guard (FR-048, WHERE RELEASES COME FROM below) is new
#     here, because the model has none;
#   - the stamp has a fifth field, REPOSITORY, the run's `$GITHUB_REPOSITORY`;
#   - the digest's definition is held to the literal `sorted-ls-tree-r-v1`
#     that `--version` prints and to the pin's `digest_definition`, where the
#     model compares it with its package's own constant;
#   - the payload's blobs and modes are checked under
#     `openrepotools/payload/`, against the commit's own paths;
#   - the install check runs on three legs, ubuntu and macOS on Python 3.x
#     and ubuntu on 3.9, with no Windows leg, checking `--version` and an
#     offline `--install` beside pipx's link, again under macOS's
#     `/bin/bash` 3.2, and compiling the payload's two Python commands on
#     3.9;
#   - no step reads the release notes (WHAT THIS WORKFLOW NEVER READS).
# It also holds more than the model where FR-029 and contracts/workflows.md
# ask for it: the gate names `tests.yml`'s four jobs, the build checks out
# full history with the submodule, and the ref step fetches the tag again
# without `--depth`.
#
# FOUR JOBS, EACH GATED ON THE ONE BEFORE IT:
#   build     the version and the repository guard; the tag, the branch, the
#             clean checkout, both environments, `tests.yml`'s four jobs on
#             this commit, and the digest; then the wheel, built twice from
#             two `git archive` extractions of the commit, stamped, compared
#             byte for byte, checked against the commit's own files, and its
#             sha256 recorded.
#   testpypi  the guard again; uploads those bytes to TestPyPI, in the
#             `testpypi` environment, then requires TestPyPI to serve
#             exactly that digest.
#   install   on ubuntu, macOS and Python 3.9: pipx installs TestPyPI's
#             file, taken by the recorded digest (on a branch, the build's
#             own wheel), and the one command it places is run.
#   pypi      the guard again; uploads the same bytes to PyPI, in the `pypi`
#             environment, which waits for Brett Heap's approval after the
#             install check, then requires PyPI to serve exactly the
#             recorded digest.
#
# DISPATCH ONLY. Nothing here runs on a push, a tag or a pull request: an
# upload is an act Brett Heap approves. The version is the tag's: `v1.1.0`
# gives `1.1.0`, which the build writes into the stamp,
# `openrepotools/_release.py`, with the tag, the commit, the digest and the
# repository. A dispatch on a tag refuses unless that tag is `v<version>`,
# annotated, and pointing at the run's own commit, and unless that commit is
# on `main` or on the version's release branch, `release/v<major>.<minor>`.
#
# RE-RUN ONLY THE FAILED JOBS ("Re-run failed jobs"), never the whole run
# and never a second dispatch of a version already uploaded. A re-run of a
# failed job reuses the build's artifact and its recorded digest, and each
# upload job requires the index to hold no file of the version but the
# verified wheel at its digest (FR-031), so a re-run after an upload that
# went through uploads nothing new. A second dispatch builds again, and its
# wheel is the same file only while the locks, the runner's Python and the
# commit all stay the same; the index keeps the first file under its name
# for good, and the upload jobs refuse any other.
#
# NO PyPI TOKEN AND NO STORED SECRET, ANYWHERE. Both uploads use trusted
# publishing (OIDC): `id-token: write` is granted to the two upload jobs and
# to no other job. The one other credential is GitHub's automatic
# GITHUB_TOKEN, read-only in every job, which `gh` uses to read this
# repository's own API.
#
# EVERY ACTION IS PINNED BY COMMIT, with its release tag beside it, as
# `tests.yml` pins them: checkout and setup-python at that file's own
# commits, the artifact actions at the model's. One limit carried over from
# the model, where it was accepted: pypa/gh-action-pypi-publish is a
# container action whose image is pulled by a registry tag, so its commit
# pins the action's files and not all the code an upload runs. The digest
# checks before and after each upload bound what that could change.
#
# RELEASING: THE PROCEDURE (FR-034 to FR-040). Brett Heap decides every
# tag, every release-branch cut and every upload, and approves each
# deployment. The release owner, lane openRepoTools-3, carries them out on
# his word: it tags, dispatches and creates the GitHub Release, and no other
# lane does. For each release:
#   1. THE COMMIT'S CI FIRST. A tag waits for its commit's `tests.yml` runs:
#      all of them finished, and the newest green, in a push or dispatch run
#      (the build's gate counts no `pull_request` run). On `main` the push
#      run that landed the commit does that once it has finished green; on
#      `release/vX.Y` the branch's own push run does, and for a commit that
#      reached the branch by fast-forward the newer of main's run and the
#      branch's decides (FR-039). Otherwise, BEFORE TAGGING, dispatch
#      `tests.yml` on a branch that points at the release commit, and wait
#      for it:
#        git push origin <release-commit>:refs/heads/<branch>
#        gh workflow run tests.yml --ref <branch> -R <repository>
#   2. THE TAG, ANNOTATED, on Brett Heap's word, with the message `v1.0.0`'s
#      has (FR-036), `<time>` the exact UTC second of his word:
#        openRepoTools vX.Y.Z
#
#        <a paragraph: what the release is>
#
#        Tagged on Brett Heap's word (<time>, "<words>")
#        Lane: <lane>
#      then push it:
#        git tag -a vX.Y.Z <release-commit> -F <message-file>
#        git push origin refs/tags/vX.Y.Z
#   3. DISPATCH THIS WORKFLOW ON THE TAG, with `version` set to X.Y.Z:
#        gh workflow run release.yml --ref vX.Y.Z -f version=X.Y.Z \
#            -R <repository>
#   4. APPROVE `testpypi`, Brett Heap's act. The install check then runs on
#      its three legs; approve `pypi` once it has passed.
#   5. ONLY AFTER PyPI SERVES THE VERSION, the GitHub Release, from a
#      checkout that has the spec leg, so the notes never name a version
#      PyPI lacks:
#        gh release create v<version> --repo <repository> --verify-tag \
#            --notes-file <spec>/docs/release-notes/v<version>.md
#   6. FOR vX.Y.0, THEN CUT `release/vX.Y` AT THE TAG, on his word:
#        git push origin 'vX.Y.0^{commit}:refs/heads/release/vX.Y'
#
# THE BRANCH AND TAG POLICY, opensoft/openRepoShape#850's (Brett Heap's
# ruling of 2026-10-17T19:52:26Z; FR-036 to FR-041):
#   - THE TRUNK is `main`, and every PR lands on it.
#   - A RELEASE IS AN ANNOTATED TAG `vX.Y.Z`, never a branch and never a
#     committed version number. A tag is never moved, never deleted and
#     never reused once it is pushed.
#   - `release/vX.Y` IS CUT AT THE `vX.Y.0` TAG, right after the tag, and
#     each patch `vX.Y.Z`, Z above 0, is tagged on it.
#   - BACK-PORTS. A fix lands on `main` first, through its own review and CI.
#     While `main` holds only that patch line's work, `release/vX.Y` takes it
#     by a fast-forward or by a merge of `main`; otherwise by a PR to
#     `release/vX.Y` of `git cherry-pick -x <squash commit>`.
#   - THE LANES' SIDE: one HOLD at a time on `release/vX.Y`; the lane that
#     landed the PR makes the back-port, unless the release owner
#     fast-forwards; and the LANDED line names both commits, main's and the
#     branch's.
#   - PATCH TAGS WAIT FOR THE NEWEST RUN: a patch is tagged on
#     `release/vX.Y` only once that commit's `tests.yml` runs have all
#     finished and the newest is green.
#   - ONE UPLOAD PER VERSION. An index never takes a file name twice, so a
#     bad upload is fixed by the next patch, never by moving a tag or
#     reusing one.
#   - The `release/*` ruleset is Brett Heap's choice, which #850 leaves to
#     him: no force-push and no deletion keeps fast-forward back-ports, and a
#     rule requiring a PR makes every back-port a cherry-pick.
#
# TWO REHEARSALS, AND NEVER 1.1.0 (FR-033). No rehearsal uses the version
# `1.1.0` itself: an index never takes a file name twice, and v1.1.0 is
# built later, from another commit, in opensoft/openRepoTools-code.
#   - THE BRANCH REHEARSAL. A dispatch on a branch builds, checks and
#     installs, and uploads nothing: the build's checks all run (the ref step
#     and the branch step stand down, because a branch has no tag and no
#     release branch to be on, FR-029), the install check runs on all three
#     legs over the build's own wheel in place of TestPyPI's, the guard
#     records `to-testpypi` and `to-pypi` as `false` on every branch, both
#     upload jobs run only on a `v*` tag, and both environments admit only
#     the tags `v*`. It builds with the version of the tag it rehearses, as
#     the model rehearsed v1.1.0 from its branch `l3-rehearsal-v1.1.0`. Before
#     v1.1.0 that is the next pre-release, so the first branch rehearsal is
#        gh workflow run release.yml --ref <branch> -f version=1.1.0rc1 \
#            -R opensoft/openRepoTools
#     A branch dispatch with `version=1.1.0` would build a 1.1.0 wheel. It
#     would upload nothing, but this procedure forbids it.
#   - THE CI GATE HOLDS IN A REHEARSAL TOO, and it counts only push and
#     dispatch runs. A feature branch's commit has only `pull_request` runs,
#     so dispatch `tests.yml` on that branch first, and wait for it to
#     finish green:
#        gh workflow run tests.yml --ref <branch> -R opensoft/openRepoTools
#   - THE TestPyPI REHEARSAL. A pre-release `X.Y.ZrcN`, `1.1.0rc1` first,
#     dispatched on its own annotated tag in opensoft/openRepoTools, on
#     Brett Heap's word as any tag is, reaches TestPyPI and the install
#     check, and the `pypi` job is skipped: the build records `to-pypi` as
#     `false` for a pre-release, so it never asks for the `pypi` approval.
#
# WHERE RELEASES COME FROM (FR-041, FR-048).
#   - FROM v1.1.0 ON, release tags are made in opensoft/openRepoTools-code,
#     the triad's code leg, where the release is built. `v1.0.0` and every
#     `rc` rehearsal tag stay in opensoft/openRepoTools, which becomes the
#     assembly, and no tag is carried from one repository to another.
#   - THE REPOSITORY GUARD (FR-048), the build's first step, decides from
#     `$GITHUB_REPOSITORY`, the ref and the version, before any approval is
#     asked. Each upload job's condition reads its record, and the job's
#     first step checks the rule again:
#       opensoft/openRepoTools-code  a tag     X.Y.Z     TestPyPI, then PyPI
#       opensoft/openRepoTools-code  a tag     X.Y.ZrcN  TestPyPI alone
#       opensoft/openRepoTools       a tag     X.Y.ZrcN  TestPyPI alone
#       opensoft/openRepoTools       a tag     X.Y.Z     refused
#       any other repository         a tag     any       refused
#       any repository               a branch  any       nothing: the rehearsal
#     So opensoft/openRepoTools sends a pre-release to TestPyPI and nothing
#     to PyPI, and every other repository uploads nothing. The names are
#     compared exactly, as GitHub spells them. opensoft/openRepoTools has no
#     pypi.org publisher at all, which is the second line of defence.
#   - opensoft/openRepoTools-code STAYS PUBLIC: the ref step fetches the tag
#     from it with no credentials, as the model does, and the migration
#     creates it public.
#   - BRETT HEAP'S ACTS, NONE OF THEM A LANE'S. The build refuses every
#     dispatch until both environments exist with a required reviewer and
#     the deployment limit, and no job reads more of these acts than that.
#     - In the repository that releases, the environments `testpypi` and
#       `pypi`, each with brettheap as the required reviewer, self-review
#       allowed, administrators not bypassing, and a deployment limit of
#       exactly one tag rule, `v*`. Only the reviewer and the limit are
#       checked here (FR-029).
#     - The ruleset on the tags `v*`, in the same repository, under which
#       only the admin role creates, moves or deletes one (named "Release
#       tags v*" in opensoft/openRepoTools). It is not checked here
#       (ACCEPTED LIMITS).
#     - On test.pypi.org, the trusted publisher for opensoft/openRepoTools:
#       project `openrepotools`, workflow `release.yml`, environment
#       `testpypi`.
#     - At the cutover, for opensoft/openRepoTools-code: its two
#       environments and its tag ruleset, the test.pypi.org publisher
#       pointed at it, and on pypi.org the project's only publisher,
#       `release.yml` with the environment `pypi`. v1.1.0 is published only
#       once both publishers and both environments exist.
#     THE ENVIRONMENT IS REQUIRED in every publisher, though the form calls
#     it optional. A publisher that names none accepts a token from ANY job
#     of a `release.yml` in its repository, so a branch's own copy of this
#     file could drop `environment:` from an upload job and publish with no
#     approval and no tag limit.
#   - ACCEPTED LIMITS, the model's, carried over where they were accepted:
#     - A deployment limit admits a tag by its NAME. Anyone who can push a
#       `v*` tag can dispatch on it, and the run is that tag's own copy of
#       this file, whatever it says. The checks here bind only where the tag
#       carries the reviewed file, which is why the tag ruleset matters.
#     - The required reviewer's approval is therefore the last line, and lane
#       sessions act as brettheap, the reviewer. An approval is a deliberate
#       act of his, never a session's.
#
# WHAT THIS WORKFLOW NEVER READS (FR-046): the release notes, and anything
# the code leg will not hold. After the cutover it runs in
# opensoft/openRepoTools-code, which holds none of `docs/`, `openspec/`,
# `specs/`, `README.md`, `AGENTS.md` and `CLAUDE.md`, so no step names one.
# `LICENSE` is the one root file the build reads, because the code leg's
# first commit gives it a byte-identical copy. The release notes are read
# by the person who creates the GitHub Release (step 5), never by a step.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to publish, X.Y.Z, or a pre-release X.Y.ZrcN for
          TestPyPI alone. Dispatch on the tag vX.Y.Z (or vX.Y.ZrcN) to
          publish it; a dispatch on a branch is a rehearsal and uploads
          nothing.
        required: true
        type: string

# Nothing by default. Each job grants itself exactly what it uses.
permissions: {}

# One release at a time, and a running one is never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    # `bash -eo pipefail`, on every runner.
    shell: bash

env:
  # The input reaches every script through the environment, never pasted
  # into one by an expression, so no input can become shell or Python.
  VERSION: ${{ inputs.version }}
  PYTHONUTF8: '1'

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read  # the checkout and its submodule, the tag, and the forge's compare and tree listing
      actions: read  # the commit's tests.yml runs and their jobs, and both environments' rules
    outputs:
      wheel: ${{ steps.record.outputs.wheel }}
      wheel-sha256: ${{ steps.record.outputs.wheel-sha256 }}
      digest: ${{ steps.digest.outputs.digest }}
      # STEP 1'S RECORD, which uploads this run may make (FR-048): each
      # upload job's `if:` reads its own, and its first step checks again.
      to-testpypi: ${{ steps.guard.outputs.to-testpypi }}
      to-pypi: ${{ steps.guard.outputs.to-pypi }}
    steps:
      # The commit, WITH ITS SUBMODULE, because the digest code exists here
      # only in the pinned openRepoShape (`upstream/openRepoShape`), and with
      # full history. The token is not left in the checkout's git config,
      # where the build backend could find it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      # STEP 1, THE JOB'S FIRST SCRIPT, AFTER THE CHECKOUT AND THE PYTHON
      # SETUP AND BEFORE ANY SCRIPT ASKS THE FORGE: THE VERSION, AND THE
      # REPOSITORY GUARD (FR-048). The model has no guard; this one puts
      # Brett Heap's answers on where releases come from into code.
      #
      # THE VERSION is a final release, X.Y.Z, or a pre-release for
      # TestPyPI, X.Y.ZrcN, in the form its file is named by: no leading
      # zero, nothing else after the numbers. Never 0.0.0, the committed
      # stamp's version, which is a build from a checkout and not a release.
      # The input is not echoed in a refusal before it is known to be plain.
      #
      # THE GUARD decides from `$GITHUB_REPOSITORY`, `$GITHUB_REF` and
      # `$VERSION` alone, and records which uploads may run:
      #   opensoft/openRepoTools-code  a tag     X.Y.Z     TestPyPI, then PyPI
      #   opensoft/openRepoTools-code  a tag     X.Y.ZrcN  TestPyPI alone
      #   opensoft/openRepoTools       a tag     X.Y.ZrcN  TestPyPI alone
      #   opensoft/openRepoTools       a tag     X.Y.Z     refused
      #   any other repository         a tag     any       refused
      #   any repository               a branch  any       nothing: the rehearsal
      # The two names are compared exactly, as GitHub spells them in
      # `$GITHUB_REPOSITORY`, so any other spelling is "any other" and fails
      # closed. A ref that is neither a tag nor a branch is refused here too,
      # as the ref step below refuses it. A refused run records nothing, and
      # since the build job asks for no approval, it asks for none.
      - name: the version is X.Y.Z or X.Y.ZrcN and not the unstamped 0.0.0, and the repository guard (FR-048) says what this run may upload
        id: guard
        run: |
          final='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          pre='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)rc(0|[1-9][0-9]*)$'
          if [[ "$VERSION" =~ $final ]]; then
            kind=final
          elif [[ "$VERSION" =~ $pre ]]; then
            kind=rc
          else
            echo "::error::the version input is not X.Y.Z or X.Y.ZrcN: numbers with no leading zero, and nothing else"
            printf 'the input, quoted: %q\n' "$VERSION"
            exit 1
          fi
          if [ "$VERSION" = 0.0.0 ]; then
            echo "::error::0.0.0 is the committed stamp's version, a build from a checkout, never a release"
            exit 1
          fi
          code_leg=opensoft/openRepoTools-code
          rc_only=opensoft/openRepoTools
          case "$GITHUB_REF" in
            refs/heads/*)
              to_testpypi=false
              to_pypi=false
              echo "a rehearsal on the branch ${GITHUB_REF#refs/heads/} of '$GITHUB_REPOSITORY': every check runs, and nothing is uploaded"
              ;;
            refs/tags/*)
              if [ "$GITHUB_REPOSITORY" = "$code_leg" ]; then
                to_testpypi=true
                if [ "$kind" = final ]; then to_pypi=true; else to_pypi=false; fi
              elif [ "$GITHUB_REPOSITORY" = "$rc_only" ] && [ "$kind" = rc ]; then
                to_testpypi=true
                to_pypi=false
              elif [ "$GITHUB_REPOSITORY" = "$rc_only" ]; then
                echo "::error::$rc_only releases a pre-release X.Y.ZrcN to TestPyPI and nothing else, and $VERSION is a final: a final is tagged and released in $code_leg"
                exit 1
              else
                echo "::error::'$GITHUB_REPOSITORY' is neither $code_leg nor $rc_only, as GitHub spells them, so a tag dispatch here may upload nothing, and the build refuses it"
                exit 1
              fi
              ;;
            *)
              echo "::error::a release is dispatched on a tag, or on a branch to rehearse, and this run names '$GITHUB_REF'"
              exit 1
              ;;
          esac
          {
            echo "to-testpypi=$to_testpypi"
            echo "to-pypi=$to_pypi"
          } >> "$GITHUB_OUTPUT"
          echo "version $VERSION ($kind), tag v$VERSION, in $GITHUB_REPOSITORY: to TestPyPI $to_testpypi, to PyPI $to_pypi"

      # THE TAG, READ FROM THE FORGE AND FROM GIT. On a tag, the run must be
      # dispatched on `v<version>` itself, an ANNOTATED tag (a lightweight
      # one records no tagger and no message), whose object names this
      # run's commit directly. On a branch the run is the rehearsal (FR-029,
      # FR-033): this check and the next stand down, every other check below
      # still runs, and nothing can deploy. Any other ref is refused. The
      # checkout holds full history, so git's copy of the tag is fetched
      # again from the forge without `--depth`, which would cut that history
      # off at this commit.
      - name: the dispatched ref is the annotated tag v<version> at this commit, or a branch to rehearse on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          case "$GITHUB_REF" in
            "refs/tags/$tag") ;;
            refs/heads/*)
              echo "::notice::REHEARSAL on the branch $GITHUB_REF_NAME at $GITHUB_SHA: every check runs, the install check installs the build's own wheel, and nothing is uploaded"
              exit 0
              ;;
            *)
              echo "::error::a release is dispatched on the tag $tag, or on a branch to rehearse, and this run names $GITHUB_REF"
              exit 1
              ;;
          esac
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq 'select(.object.type == "tag") | .object.sha')" || object=
          if [ -z "$object" ]; then
            echo "::error::the forge holds no annotated tag $tag; a release tag is made with git tag -a"
            exit 1
          fi
          read -r name type commit < <(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" \
              --jq '[.tag, .object.type, .object.sha] | @tsv') || true
          if [ "$name" != "$tag" ] || [ "$type" != commit ] || [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::the tag object $object is named '$name' and points at the $type $commit; a release needs $tag pointing at this run's commit $GITHUB_SHA"
            exit 1
          fi
          git fetch --quiet --no-tags origin "+refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "refs/tags/$tag")" != tag ] \
              || [ "$(git rev-parse "refs/tags/$tag")" != "$object" ] \
              || [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::git's $tag is not the forge's annotated tag $object at $GITHUB_SHA"
            exit 1
          fi
          echo "$tag: annotated, tag object $object, at $GITHUB_SHA"

      # THE COMMIT IS ON main OR ON THE VERSION'S RELEASE BRANCH. A tag can be
      # pushed at any commit; a release is cut from one that a reviewed branch
      # holds, as `main` itself or an ancestor of it (`identical` or `ahead`).
      # `release/v<major>.<minor>` is where a patch on an older line is
      # tagged (FR-037), and a pre-release's line is its own: `1.1.0rc1`
      # belongs to `release/v1.1`. The compare names `refs/heads/<branch>`:
      # a bare name would resolve to a tag of that name first. A rehearsal
      # on a branch has no release branch to be on.
      - name: the commit is on main or on the version's release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/*)
              echo "a rehearsal on the branch $GITHUB_REF_NAME: no release branch to be on"
              exit 0
              ;;
          esac
          found=
          for branch in main "release/v${VERSION%.*}"; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...refs/heads/$branch" \
                --jq .status 2>/dev/null)" || status=
            case "$status" in
              identical|ahead)
                found="$branch"
                echo "$GITHUB_SHA is on $branch ($status)"
                break
                ;;
              *) echo "$GITHUB_SHA is not on $branch (compare: ${status:-no such branch})" ;;
            esac
          done
          if [ -z "$found" ]; then
            echo "::error::$GITHUB_SHA is on neither main nor release/v${VERSION%.*}; a release is cut from a commit one of them holds"
            exit 1
          fi

      # THE CHECKOUT IS THIS COMMIT, AND CLEAN, before anything from it runs.
      # The digest below is computed by the pinned submodule's own
      # `scripts/repo_shape.py`, and a file changed or added in the work tree,
      # or a submodule moved off its pin, would be code nobody reviewed.
      # Ignored files count too.
      - name: the checkout is this commit, and clean
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::the checkout is at $head, and this run is at $GITHUB_SHA"
            exit 1
          fi
          dirty="$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          if [ -n "$dirty" ]; then
            echo "::error::the checkout is not clean, so the release would not be the commit's own bytes:"
            printf '%s\n' "$dirty"
            exit 1
          fi
          echo "HEAD is $GITHUB_SHA, and the work tree holds its files and nothing else"

      # BOTH ENVIRONMENTS MUST ASK A REVIEWER AND ADMIT ONLY THE TAGS v*.
      # GitHub creates an environment a job names if it does not exist yet,
      # with no protection rule at all, so a dispatch made before Brett Heap
      # configured them would upload with nobody approving. And a dispatch
      # runs the dispatched ref's own copy of this file, so an environment
      # any ref may deploy to would publish whatever a branch carries. Each
      # environment must name a required reviewer, and its deployment limit
      # must be exactly one rule, the tag pattern `v*`. Either gap refuses
      # here, before anything is built.
      - name: both environments ask a reviewer and admit only the tags v*
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]


          def api(path):
              done = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              return json.loads(done.stdout) if done.returncode == 0 else None


          problems = []
          for environment in ("testpypi", "pypi"):
              settings = api(f"repos/{repo}/environments/{environment}")
              if settings is None:
                  problems.append(f"the {environment} environment cannot be read: it does not "
                                  "exist yet. Create it with a required reviewer and a "
                                  "deployment limit to the tags v* first")
                  continue
              reviewers = [entry.get("reviewer", {}).get("login") or entry.get("reviewer", {}).get("slug")
                           for rule in settings.get("protection_rules") or []
                           if rule.get("type") == "required_reviewers"
                           for entry in rule.get("reviewers") or []]
              policy = settings.get("deployment_branch_policy") or {}
              limits = api(f"repos/{repo}/environments/{environment}/deployment-branch-policies?per_page=100")
              rules = sorted((p.get("type"), p.get("name")) for p in (limits or {}).get("branch_policies") or [])
              if not reviewers:
                  problems.append(f"the {environment} environment names no required reviewer, "
                                  "so a deployment to it would not wait for an approval")
              if policy.get("custom_branch_policies") is not True or rules != [("tag", "v*")]:
                  problems.append(f"the {environment} environment's deployment limit is {rules} "
                                  f"({policy!r}), not the one rule ('tag', 'v*'): a dispatch on "
                                  "a branch runs that branch's own copy of this file")
              else:
                  print(f"{environment}: reviewers {reviewers}; only the tags v* can deploy")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

      # THE GATE THIS REPOSITORY LANDS BY, ON THIS COMMIT'S OWN TREE (FR-029,
      # FR-046). `.github/workflows/tests.yml` runs its four jobs,
      # `guard-launch-mode`, `tests`, `tests-no-submodule` and `package`, on
      # every trigger, and each must have passed in a run that tested THIS
      # commit: a `push` or `workflow_dispatch` run whose head is the
      # commit, so the push run that landed a commit on main counts when it
      # finished green (a run a later landing cancelled does not; each
      # refusal names the dispatch that answers it). A `pull_request` run is
      # not counted, because it reports the PR's head but tests a merge of
      # it with its base, another tree. The jobs are read from each run
      # itself (`actions/runs/<id>/jobs`), never from the commit's check
      # runs, which anything holding an Actions token can create inside that
      # run's check suite. The gate NAMES the four jobs it requires and never
      # takes the set from what a run holds: a gate that adapts could not
      # notice a job gone missing. Skipped jobs are passed over. Of the rest,
      # none may still be running, and the newest to finish must have
      # succeeded. The rehearsal is held to it too, so a branch's commit,
      # which has only `pull_request` runs, needs `tests.yml` dispatched on
      # that branch first.
      - name: the commit carries passing guard-launch-mode, tests, tests-no-submodule and package jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          repo, sha = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]
          gate = ("guard-launch-mode", "tests", "tests-no-submodule", "package")
          workflow = ".github/workflows/tests.yml"
          remedy = (f"dispatch tests.yml on a branch that points at {sha} (`gh workflow run "
                    "tests.yml --ref <branch>`), or on the tag once it is pushed (`gh workflow "
                    f"run tests.yml --ref v{os.environ.get('VERSION', '<version>')}`), wait for "
                    "it, then re-run this run; `--ref main` tests main's current head, not this "
                    "commit")


          def rows(path, key):
              done = subprocess.run(["gh", "api", "--paginate", path, "--jq", f".{key}[]"],
                                    capture_output=True, text=True)
              if done.returncode != 0:
                  sys.exit(f"::error::`gh api {path}` failed, so the checks on {sha} are "
                           f"unknown: {done.stderr.strip()}")
              return [json.loads(line) for line in done.stdout.splitlines() if line.strip()]


          runs = [run for run in rows(f"repos/{repo}/actions/runs?head_sha={sha}&per_page=100", "workflow_runs")
                  if run.get("path") == workflow and run.get("head_sha") == sha
                  and run.get("event") in ("push", "workflow_dispatch")]
          checks = [job for run in runs
                    for job in rows(f"repos/{repo}/actions/runs/{run['id']}/jobs?filter=all&per_page=100", "jobs")]
          problems = []
          for name in gate:
              ran = [c for c in checks if c["name"] == name and c.get("conclusion") != "skipped"]
              running = [c for c in ran if c["status"] != "completed"]
              if running:
                  problems.append(f"`{name}` is {running[0]['status']} on {sha} "
                                  f"({running[0]['html_url']}); dispatch again once it ends")
              elif not ran:
                  problems.append(f"`{name}` has not run on {sha}: {remedy}")
              else:
                  newest = max(ran, key=lambda c: c["completed_at"])
                  if newest["conclusion"] != "success":
                      problems.append(f"`{name}`'s newest run on {sha} ended "
                                      f"{newest['conclusion']} ({newest['html_url']}): {remedy}")
                  else:
                      print(f"{name}: success at {newest['completed_at']}, {newest['html_url']}")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

      # THE DIGEST THE STAMP CARRIES, computed by the PINNED submodule's own
      # `upstream/openRepoShape/scripts/repo_shape.py` (`tree_digest`), and
      # required to equal the same definition read from the forge's own tree
      # listing (`tree_digest_from_gh`). No copy of that code is kept here
      # (FR-030). Its definition is held, before anything is digested, to
      # the literal `--version` labels every stamped digest with,
      # `sorted-ls-tree-r-v1`, and to the definition the pin,
      # `contracts/openreposhape-pin.yaml`, names (FR-029): a pin bumped to
      # a standard that digests another way refuses here, rather than ship
      # a digest under a wrong label. The model compares with its package's
      # own constant, which this package does not have (Decision 10).
      - name: the commit's tree digest is the forge's, by the definition the pin and --version name
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B - <<'PY'
          import os, sys
          from pathlib import Path

          here = Path.cwd()
          scripts = here / "upstream" / "openRepoShape" / "scripts"
          pin = here / "contracts" / "openreposhape-pin.yaml"
          literal = "sorted-ls-tree-r-v1"
          sys.path[:0] = [str(scripts)]
          import repo_shape

          if Path(repo_shape.__file__).resolve() != (scripts / "repo_shape.py").resolve():
              sys.exit(f"::error::repo_shape was imported from {repo_shape.__file__}, not from "
                       f"the pinned {scripts / 'repo_shape.py'}")
          sha, repo = os.environ["GITHUB_SHA"], os.environ["GITHUB_REPOSITORY"]
          try:
              manifest = repo_shape.load_yaml(pin)
          except repo_shape.Refusal as error:
              sys.exit(f"::error::{error}")
          pinned = manifest.get("digest_definition") if isinstance(manifest, dict) else None
          standard = repo_shape.TREE_DIGEST_DEFINITION
          if standard != literal or pinned != literal:
              sys.exit(f"::error::the pinned scripts/repo_shape.py digests by {standard!r} and "
                       f"contracts/openreposhape-pin.yaml names {pinned!r}, and --version labels "
                       f"every digest {literal}: all three must be {literal}")
          try:
              local = repo_shape.tree_digest(here, sha)
              forge = repo_shape.tree_digest_from_gh(repo, sha)
          except repo_shape.Refusal as error:
              sys.exit(f"::error::{error}")
          if local != forge:
              sys.exit(f"::error::{sha} digests to {local} here and to {forge} from the forge's "
                       "tree listing; the release would not be the forge's commit")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"digest={local}\n")
          print(f"{sha}: {standard} {local}, here and on the forge")
          PY

      # THE RELEASE TOOLS, FROM THEIR HASH LOCK, IN A VENV OF THEIR OWN:
      # the `build` frontend, the `hatchling` backend at `pyproject.toml`'s
      # own pin, and every requirement of either, each by digest, wheels
      # only (`.github/release-build-requirements.txt` says why).
      - name: install the release tools from their hash lock
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --disable-pip-version-check \
              --no-cache-dir --only-binary :all: --require-hashes \
              -r .github/release-build-requirements.txt
          "$RUNNER_TEMP/tools/bin/python" -m pip list --disable-pip-version-check
          python -VV

      # FROM `git archive` OF THE COMMIT, TWICE, into two directories of
      # different names and depths. The wheel is built from the commit's
      # own tree, never from the checkout, and two builds that share no
      # directory are what can show the bytes depend on the commit alone.
      - name: extract the commit twice, into two directories
        run: |
          tree_a="$RUNNER_TEMP/a/openRepoTools"
          tree_b="$RUNNER_TEMP/b/elsewhere/v$VERSION-src"
          for tree in "$tree_a" "$tree_b"; do
            mkdir -p "$tree"
            git archive --format=tar "$GITHUB_SHA" | tar -x -f - -C "$tree"
          done
          {
            echo "TREE_A=$tree_a"
            echo "TREE_B=$tree_b"
          } >> "$GITHUB_ENV"
          diff -r "$tree_a" "$tree_b"
          echo "$GITHUB_SHA extracted into $tree_a and $tree_b"

      # THE STAMP, WRITTEN THE PACKAGE'S OWN WAY (FR-009, FR-013): the
      # committed `src/openrepotools/_release.py`, each of its five
      # assignment lines replaced exactly once with the release's value, and
      # every other byte, the SPDX line and the docstring among them, as it
      # was. A count other than one refuses, so a file already stamped is
      # refused. VERSION, TAG, COMMIT, DIGEST and REPOSITORY come from the
      # environment, REPOSITORY from `$GITHUB_REPOSITORY` (Decision 10's
      # fifth field), and nothing is pasted in by an expression. Each value
      # must have the shape the command's bash reader (`stamp_read`) gives a
      # stamped field, and both files are stamped and checked before either
      # is written, then read again. `pyproject.toml` reads VERSION from the
      # stamp (hatchling's version source), and `openRepoTools --version`
      # reads all five. `tests/test_release_workflow.py` runs this very
      # script against the committed file, and reads its output back with
      # `--version`.
      - name: write the stamp into both extractions
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          export TAG="v$VERSION" COMMIT="$GITHUB_SHA" REPOSITORY="$GITHUB_REPOSITORY"
          python3 -I - "$TREE_A/src/openrepotools/_release.py" "$TREE_B/src/openrepotools/_release.py" <<'PY'
          import ast, os, re, sys

          names = ("VERSION", "TAG", "COMMIT", "DIGEST", "REPOSITORY")
          number = r"(0|[1-9][0-9]*)"
          version = rf"{number}\.{number}\.{number}(rc{number})?"
          shapes = {"VERSION": version, "TAG": rf"v{version}", "COMMIT": r"[0-9a-f]{40}",
                    "DIGEST": r"[0-9a-f]{64}",
                    "REPOSITORY": r"([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9-]*[A-Za-z0-9])"
                                  r"/(?!\.\.?\Z)[A-Za-z0-9._-]+"}
          unstamped = {"VERSION": "0.0.0", "TAG": "", "COMMIT": "", "DIGEST": "", "REPOSITORY": ""}
          release = {name: os.environ.get(name, "") for name in names}
          for name, value in release.items():
              if not re.fullmatch(shapes[name], value) or value == unstamped[name]:
                  sys.exit(f"::error::the stamp's {name} would be {value!r}, which is not a release's")
          if release["TAG"] != "v" + release["VERSION"]:
              sys.exit(f"::error::the stamp's TAG would be {release['TAG']!r}, and a release's "
                       f"tag is v{release['VERSION']}")
          if len(sys.argv) != 3:
              sys.exit(f"::error::the stamp is written into the two extractions, and this run "
                       f"names {sys.argv[1:]}")


          def assigned(text):
              try:
                  body = ast.parse(text).body
              except SyntaxError as error:
                  return f"no assignment at all: it is not Python ({error})"
              return {node.targets[0].id: node.value.value for node in body
                      if isinstance(node, ast.Assign) and len(node.targets) == 1
                      and isinstance(node.targets[0], ast.Name)
                      and isinstance(node.value, ast.Constant)}


          stamped = {}
          for path in sys.argv[1:]:
              with open(path, encoding="utf-8", newline="") as handle:
                  text = handle.read()
              for name, value in release.items():
                  line = f'{name} = "{value}"'
                  text, count = re.subn(rf'^{name} = "{re.escape(unstamped[name])}"$',
                                        lambda _: line, text, flags=re.M)
                  if count != 1:
                      sys.exit(f"::error::{path} assigns {name} = \"{unstamped[name]}\" {count} "
                               "times, not once: it is not the committed, unstamped stamp")
              if assigned(text) != release:
                  sys.exit(f"::error::{path} would assign {assigned(text)} after stamping, not {release}")
              stamped[path] = text
          for path, text in stamped.items():
              with open(path, "w", encoding="utf-8", newline="") as handle:
                  handle.write(text)
              with open(path, encoding="utf-8", newline="") as handle:
                  again = handle.read()
              if again != text or assigned(again) != release:
                  sys.exit(f"::error::{path} reads back as {assigned(again)}, not {release}")
              print(f"{path}: {release}")
          PY

      # TWICE, AT THE COMMIT'S OWN TIME, AND THE TWO MUST BE ONE FILE: the
      # bytes depend on the commit and the locked tools, not on the
      # directory built in. A wheel only: one pure file, its times from
      # `SOURCE_DATE_EPOCH` (an sdist can come later). `--no-isolation`, so
      # the backend is the hash-locked one, and `build` refuses a backend
      # that does not satisfy `[build-system] requires`.
      - name: build the wheel from each extraction, and the two are one file
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          wheel="openrepotools-$VERSION-py3-none-any.whl"
          for side in a b; do
            if [ "$side" = a ]; then tree="$TREE_A"; else tree="$TREE_B"; fi
            (cd "$tree" && "$RUNNER_TEMP/tools/bin/python" -m build --wheel --no-isolation \
                --outdir "$RUNNER_TEMP/dist-$side" .)
            found="$(ls -A "$RUNNER_TEMP/dist-$side")"
            if [ "$found" != "$wheel" ]; then
              echo "::error::the build from $tree made '$found', and a release is exactly $wheel"
              exit 1
            fi
          done
          if ! cmp "$RUNNER_TEMP/dist-a/$wheel" "$RUNNER_TEMP/dist-b/$wheel"; then
            echo "::error::two builds of $GITHUB_SHA, from two extractions in two directories, are not one file: the wheel depends on where it was built, and nothing is uploaded"
            exit 1
          fi
          sha256sum "$RUNNER_TEMP/dist-a/$wheel" "$RUNNER_TEMP/dist-b/$wheel"
          echo "SOURCE_DATE_EPOCH $SOURCE_DATE_EPOCH: two builds, one file"

      # EVERY FILE IN THE WHEEL BUT THE STAMP AND THE METADATA IS THE
      # COMMIT'S OWN, read from git (FR-006, FR-030): each module from
      # `src/openrepotools/`, byte for byte, and each payload file, at
      # `openrepotools/payload/<P>`, from `<P>` at the commit, byte for byte
      # and with the commit's mode, `100755` as 0755 and `100644` as 0644,
      # which is how hatchling 1.27.0's reproducible build writes them.
      # Every file git tracks under `src/openrepotools/` and every path
      # `pyproject.toml` force-includes is in it, and nothing else is. The
      # stamp is the committed one with exactly its five values written. The
      # metadata names this version, `pyproject.toml`'s dependencies and its
      # one command, and carries the commit's LICENSE (FR-002: hatchling
      # builds a wheel with no LICENSE and says nothing, so this check is
      # what refuses one). A missing member is named, never a traceback.
      # `tests/test_release_workflow.py` runs this very script on synthetic
      # wheels made from the commit's blobs.
      - name: the wheel holds the commit's own files, byte for byte and mode for mode, and the stamp
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          export TAG="v$VERSION" COMMIT="$GITHUB_SHA" REPOSITORY="$GITHUB_REPOSITORY"
          python3 -I - "$RUNNER_TEMP/dist-a/openrepotools-$VERSION-py3-none-any.whl" <<'PY'
          import ast, configparser, email.parser, os, re, stat, subprocess, sys, tomllib, zipfile

          names = ("VERSION", "TAG", "COMMIT", "DIGEST", "REPOSITORY")
          release = {name: os.environ.get(name, "") for name in names}
          unstamped = {"VERSION": "0.0.0", "TAG": "", "COMMIT": "", "DIGEST": "", "REPOSITORY": ""}
          version, sha = release["VERSION"], os.environ.get("GITHUB_SHA", "")
          run = {"TAG": f"v{version}", "COMMIT": sha,
                 "REPOSITORY": os.environ.get("GITHUB_REPOSITORY", "")}
          if not re.fullmatch(r"[0-9a-f]{40}", sha) or any(release[k] != v for k, v in run.items()):
              sys.exit(f"::error::the release's values {release} are not this run's {run}")
          if len(sys.argv) != 2:
              sys.exit(f"::error::the check reads one wheel, and this run names {sys.argv[1:]}")
          info, stamp = f"openrepotools-{version}.dist-info/", "openrepotools/_release.py"
          payload, package = "openrepotools/payload/", "src/openrepotools/"
          modes = {"100755": 0o755, "100644": 0o644}

          listing = subprocess.run(["git", "ls-tree", "-r", "-z", "--full-tree", sha],
                                   capture_output=True)
          if listing.returncode != 0:
              sys.exit(f"::error::git cannot list {sha}: {listing.stderr.decode().strip()}")
          tree = {}
          for record in listing.stdout.split(b"\0"):
              if record:
                  meta, _, path = record.partition(b"\t")
                  mode, kind, oid = meta.decode("ascii").split(" ")
                  tree[path.decode("utf-8")] = (mode, kind, oid)


          def committed(path):
              entry = tree.get(path)
              if entry is None or entry[1] != "blob":
                  return None
              done = subprocess.run(["git", "cat-file", "blob", entry[2]], capture_output=True)
              return done.stdout if done.returncode == 0 else None


          def assigned(text):
              try:
                  body = ast.parse(text).body
              except SyntaxError:
                  return None
              return {n.targets[0].id: n.value.value for n in body
                      if isinstance(n, ast.Assign) and len(n.targets) == 1
                      and isinstance(n.targets[0], ast.Name) and isinstance(n.value, ast.Constant)}


          problems = []
          declared_file = committed("pyproject.toml")
          if declared_file is None:
              sys.exit(f"::error::{sha} has no pyproject.toml to check the wheel against")
          try:
              pyproject = tomllib.loads(declared_file.decode("utf-8"))
          except (tomllib.TOMLDecodeError, UnicodeDecodeError) as error:
              sys.exit(f"::error::{sha}'s pyproject.toml cannot be read: {error}")
          project = pyproject.get("project", {})
          forced = (pyproject.get("tool", {}).get("hatch", {}).get("build", {}).get("targets", {})
                    .get("wheel", {}).get("force-include", {}))
          sources = {}
          for source, member in forced.items():
              if member != payload + source:
                  problems.append(f"pyproject.toml force-includes {source} as {member}, "
                                  f"not as {payload}{source}")
              sources[member] = source
          modules = {"openrepotools/" + path[len(package):]: path for path in tree
                     if path.startswith(package)}
          wanted = set(modules) | set(sources)

          try:
              wheel = zipfile.ZipFile(sys.argv[1])
          except (OSError, zipfile.BadZipFile) as error:
              sys.exit(f"::error::{sys.argv[1]} cannot be read as a wheel: {error}")
          with wheel:
              entries = [e for e in wheel.infolist() if not e.filename.endswith("/")]
              listed = [e.filename for e in entries]
              if len(listed) != len(set(listed)):
                  problems.append("the wheel names one file twice")
              members = {e.filename: e for e in entries}


              def read(name):
                  return wheel.read(members[name]) if name in members else None


              for name in sorted(members):
                  if name.startswith(info) or name == stamp:
                      continue
                  if name in sources:
                      source = sources[name]
                      data, entry = committed(source), tree.get(source)
                      want = modes.get(entry[0]) if entry else None
                      got = stat.S_IMODE(members[name].external_attr >> 16)
                      if data is None or want is None:
                          problems.append(f"{name} is in the wheel, and {source} is not a regular "
                                          f"file at {sha}")
                          continue
                      fine = True
                      if read(name) != data:
                          problems.append(f"{name} in the wheel is not {source} at {sha}, byte for byte")
                          fine = False
                      if got != want:
                          problems.append(f"{name} has mode {got:04o} in the wheel, and {source} is "
                                          f"{entry[0]} at {sha}, which is {want:04o}")
                          fine = False
                      if fine:
                          print(f"{name} = {sha[:12]}:{source}, mode {got:04o}")
                  elif name in modules:
                      source = modules[name]
                      if read(name) != committed(source):
                          problems.append(f"{name} in the wheel is not {source} at {sha}")
                      else:
                          print(f"{name} = {sha[:12]}:{source}")
                  else:
                      problems.append(f"{name} is in the wheel, and neither {package} nor "
                                      "pyproject.toml's force-include puts it there")
              for name in sorted(wanted - set(members)):
                  problems.append(f"{name} is tracked or force-included, and missing from the wheel")

              base, shipped, before = committed(package + "_release.py"), read(stamp), len(problems)
              if base is None or shipped is None:
                  problems.append(f"the stamp {stamp} is missing from the wheel or from {sha}")
              else:
                  expected = base.decode("utf-8")
                  for name in names:
                      line = f'{name} = "{release[name]}"'
                      expected, count = re.subn(rf'^{name} = "{re.escape(unstamped[name])}"$',
                                                lambda _: line, expected, flags=re.M)
                      if count != 1:
                          problems.append(f"the committed stamp assigns {name} = "
                                          f"\"{unstamped[name]}\" {count} times, not once")
                  if shipped != expected.encode("utf-8"):
                      old, new = expected.split("\n"), shipped.decode("utf-8", "replace").split("\n")
                      if len(old) != len(new):
                          problems.append(f"the stamp has {len(new)} lines, and the committed "
                                          f"_release.py stamped has {len(old)}")
                      for ours, theirs in zip(old, new):
                          if ours != theirs:
                              problems.append(f"the stamp says {theirs!r} where the release's says {ours!r}")
                      if old == new:
                          problems.append("the stamp is not the committed _release.py, stamped, byte for byte")
                  values = assigned(shipped.decode("utf-8", "replace"))
                  if values != release:
                      problems.append(f"the stamp assigns {values}, not {release}")
                  if len(problems) == before:
                      print(f"{stamp}: the committed file, with {list(names)} written")

              raw = read(info + "METADATA")
              if raw is None:
                  problems.append(f"the wheel has no {info}METADATA")
              else:
                  meta = email.parser.BytesParser().parsebytes(raw)
                  shown = {"Name": meta["Name"], "Version": meta["Version"],
                           "Requires-Python": meta["Requires-Python"],
                           "Requires-Dist": sorted(meta.get_all("Requires-Dist") or [])}
                  declared = {"Name": project.get("name"), "Version": version,
                              "Requires-Python": project.get("requires-python"),
                              "Requires-Dist": sorted(project.get("dependencies") or [])}
                  if shown != declared:
                      problems.append(f"the metadata says {shown}, and pyproject.toml {declared}")
                  print(f"metadata: {shown}")
              raw = read(info + "entry_points.txt")
              if raw is None:
                  problems.append(f"the wheel has no {info}entry_points.txt")
              else:
                  entry_points = configparser.ConfigParser(delimiters=("=",), interpolation=None)
                  entry_points.optionxform = str
                  try:
                      entry_points.read_string(raw.decode("utf-8"))
                  except (configparser.Error, UnicodeDecodeError) as error:
                      problems.append(f"the wheel's entry_points.txt cannot be read: {error}")
                  if entry_points.sections() != ["console_scripts"]:
                      problems.append(f"the wheel's entry points declare {entry_points.sections()}, "
                                      "not ['console_scripts'] alone")
                  scripts = ({k: v.strip() for k, v in entry_points["console_scripts"].items()}
                             if entry_points.has_section("console_scripts") else {})
                  if scripts != project.get("scripts"):
                      problems.append(f"the wheel's commands are {scripts}, not {project.get('scripts')}")
                  print(f"commands: {sorted(scripts)}")
              described = sorted(n[len(info):] for n in members if n.startswith(info))
              if described != sorted(["METADATA", "WHEEL", "RECORD", "entry_points.txt",
                                      "licenses/LICENSE"]):
                  problems.append(f"the wheel's {info} holds {described}, not exactly METADATA, "
                                  "WHEEL, RECORD, entry_points.txt and licenses/LICENSE")
              licence, commits = read(info + "licenses/LICENSE"), committed("LICENSE")
              if commits is None:
                  problems.append(f"{sha} has no LICENSE, and the wheel must carry the commit's")
              elif licence is None:
                  problems.append(f"the wheel has no {info}licenses/LICENSE, so the commit's LICENSE "
                                  "is not in it")
              elif licence != commits:
                  problems.append(f"the wheel's {info}licenses/LICENSE is not the commit's LICENSE")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

      # THE DIGEST IS RECORDED HERE, and every later job checks the file it
      # holds against it: before each upload, after each upload against what
      # the index serves, and before the install check runs anything.
      - name: record the wheel and its sha256
        id: record
        run: |
          wheel="openrepotools-$VERSION-py3-none-any.whl"
          {
            echo "wheel=$wheel"
            echo "wheel-sha256=$(sha256sum "$RUNNER_TEMP/dist-a/$wheel" | cut -d' ' -f1)"
          } | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheel
          path: ${{ runner.temp }}/dist-a/
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI
    needs: build
    # ON A v* TAG ONLY, AND ONLY WHERE THE BUILD'S GUARD SENDS THIS VERSION
    # (FR-048): `to-testpypi` is `true` for any version on a tag in
    # opensoft/openRepoTools-code and for a pre-release on a tag in
    # opensoft/openRepoTools, and the build refused every other tag. A
    # branch is the rehearsal, and both environments would refuse it anyway
    # (their deployment limit is the tags v*). With no status function in
    # it, `if:` also requires the build to have succeeded.
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.to-testpypi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: testpypi
      url: https://test.pypi.org/project/openrepotools/${{ inputs.version }}/
    permissions:
      id-token: write  # trusted publishing: the OIDC token TestPyPI accepts
      actions: read  # this environment's rules and this run's approvals
      contents: read  # the tag, read again
    env:
      WHEEL: ${{ needs.build.outputs.wheel }}
      WHEEL_SHA256: ${{ needs.build.outputs.wheel-sha256 }}
      INDEX: TestPyPI
      JSON_BASE: https://test.pypi.org/pypi/openrepotools/
    steps:
      # THE REPOSITORY GUARD AGAIN, ON ITS OWN, FIRST (FR-048), in case the
      # job's condition is ever loosened or the build's record is wrong:
      # TestPyPI takes any release from opensoft/openRepoTools-code, a
      # pre-release X.Y.ZrcN alone from opensoft/openRepoTools, and nothing
      # from any other repository, each from its own tag v<version>. The
      # names are compared exactly, as GitHub spells them.
      - name: the repository guard (FR-048) again, before anything else, and this repository may send v<version> to TestPyPI
        run: |
          final='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          pre='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)rc(0|[1-9][0-9]*)$'
          if [[ "$VERSION" =~ $final ]] && [ "$VERSION" != 0.0.0 ]; then
            kind=final
          elif [[ "$VERSION" =~ $pre ]]; then
            kind=rc
          else
            echo "::error::the version input is not X.Y.Z or X.Y.ZrcN, so nothing is uploaded"
            printf 'the input, quoted: %q\n' "$VERSION"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "::error::an upload is made from the tag v$VERSION alone, and this run names '$GITHUB_REF', so nothing is uploaded"
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" = opensoft/openRepoTools-code ]; then
            echo "opensoft/openRepoTools-code sends $VERSION ($kind) to TestPyPI"
          elif [ "$GITHUB_REPOSITORY" = opensoft/openRepoTools ] && [ "$kind" = rc ]; then
            echo "opensoft/openRepoTools sends the pre-release $VERSION to TestPyPI, and nothing to PyPI"
          elif [ "$GITHUB_REPOSITORY" = opensoft/openRepoTools ]; then
            echo "::error::opensoft/openRepoTools sends a pre-release X.Y.ZrcN to TestPyPI and nothing else, and $VERSION is a final, so nothing is uploaded"
            exit 1
          else
            echo "::error::'$GITHUB_REPOSITORY' is neither opensoft/openRepoTools-code nor opensoft/openRepoTools, as GitHub spells them, so nothing is uploaded"
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wheel
          path: dist

      - name: dist holds the wheel the build job verified, and nothing else
        run: |
          found="$(ls -A dist)"
          if [ "$found" != "$WHEEL" ]; then
            echo "::error::dist holds '$found', and the build job verified $WHEEL"
            exit 1
          fi
          echo "$WHEEL_SHA256  dist/$WHEEL" | sha256sum --strict -c -

      # AT USE TIME, the environment's rules again, and this run's approval.
      # The build job's reading goes stale while the run waits: a rule
      # removed meanwhile would let this job start with nobody approving it.
      - name: this environment still asks a reviewer and admits only the tags v*, and this run's deployment to it was approved
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: testpypi
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          repo, environment = os.environ["GITHUB_REPOSITORY"], os.environ["ENVIRONMENT"]


          def api(path):
              done = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if done.returncode != 0:
                  sys.exit(f"::error::`gh api {path}` failed, so nothing is uploaded: {done.stderr.strip()}")
              return json.loads(done.stdout)


          settings = api(f"repos/{repo}/environments/{environment}")
          reviewers = [rule for rule in settings.get("protection_rules") or []
                       if rule.get("type") == "required_reviewers" and rule.get("reviewers")]
          policy = settings.get("deployment_branch_policy") or {}
          limits = api(f"repos/{repo}/environments/{environment}/deployment-branch-policies?per_page=100")
          rules = sorted((p.get("type"), p.get("name")) for p in limits.get("branch_policies") or [])
          if not reviewers:
              sys.exit(f"::error::the {environment} environment names no required reviewer now")
          if policy.get("custom_branch_policies") is not True or rules != [("tag", "v*")]:
              sys.exit(f"::error::the {environment} environment's deployment limit is now {rules}, "
                       "not the one rule ('tag', 'v*'), so nothing is uploaded")
          approved = [review["user"]["login"]
                      for review in api(f"repos/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}/approvals")
                      if review.get("state") == "approved"
                      and any(e.get("name") == environment for e in review.get("environments") or [])]
          if not approved:
              sys.exit(f"::error::this run holds no approval of a deployment to {environment}, "
                       "so nothing is uploaded")
          print(f"{environment}: a reviewer, the tags v* alone, and approved by {', '.join(approved)}")
          PY

      # THE TAG, AGAIN, RIGHT BEFORE THE UPLOAD. The run may have waited on
      # an approval, and a tag can be moved or deleted meanwhile; an upload
      # cannot be taken back.
      - name: the tag v<version> still names this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" \
              --jq 'select(.object.type == "tag") | .object.sha')" || object=
          commit=
          if [ -n "$object" ]; then
            commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" \
                --jq 'select(.object.type == "commit") | .object.sha')" || commit=
          fi
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::the annotated tag v$VERSION no longer names $GITHUB_SHA (it names '$commit'), so nothing is uploaded"
            exit 1
          fi
          echo "v$VERSION still names $GITHUB_SHA"

      # BEFORE THE UPLOAD, NOTHING ELSE HELD. skip-existing skips a file
      # name the index already holds, so the index must hold no file of
      # this version but the verified wheel, at its verified digest: an
      # index never replaces a file. A 404 is a version with no file yet.
      # The verified wheel itself, already there, is a re-run of this job
      # after its upload went through, and uploads nothing new.
      - name: the index holds no file of this version but the verified wheel
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          index, version = os.environ["INDEX"], os.environ["VERSION"]
          url = f"{os.environ['JSON_BASE']}{version}/json"
          wanted = {os.environ["WHEEL"]: os.environ["WHEEL_SHA256"]}
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print(f"{index} holds no file of openrepotools {version} yet")
              sys.exit(0)
          held = {f["filename"]: f["digests"]["sha256"] for f in release["urls"]}
          other = {name: digest for name, digest in held.items() if wanted.get(name) != digest}
          if other:
              sys.exit(f"::error::{index} already holds {other} for openrepotools {version}, "
                       "which the build job did not verify, so nothing is uploaded")
          yanked = sorted(f["filename"] for f in release["urls"] if f.get("yanked"))
          if yanked:
              sys.exit(f"::error::{index} holds {yanked} at the verified digest, but yanked; "
                       "un-yank it on the index, or release a new version")
          print(f"{index} holds {sorted(held)}, at the verified digest; skip-existing uploads nothing new")
          PY

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

      # AFTER THE UPLOAD, the index serves exactly the verified wheel, by
      # digest, not yanked. Its JSON can lag an upload, so it is read up to
      # 20 times, 15 seconds apart.
      - name: the index serves exactly the verified wheel
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          index, version = os.environ["INDEX"], os.environ["VERSION"]
          url = f"{os.environ['JSON_BASE']}{version}/json"
          wanted = {os.environ["WHEEL"]: os.environ["WHEEL_SHA256"]}
          served = None
          for attempt in range(1, 21):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      release = json.load(response)
                  served = {f["filename"]: f["digests"]["sha256"] for f in release["urls"]}
                  if served == wanted:
                      if any(f.get("yanked") for f in release["urls"]):
                          sys.exit(f"::error::{index} serves the verified wheel, yanked")
                      break
                  print(f"read {attempt}: {index} serves {served} so far")
              except (urllib.error.URLError, TimeoutError, ConnectionError) as error:
                  code = getattr(error, "code", None)
                  if code is not None and code != 404 and code < 500:
                      raise
                  print(f"read {attempt}: {url} did not answer yet ({error})")
              time.sleep(15)
          else:
              sys.exit(f"::error::after 20 reads {index} serves {served}, and the build job "
                       f"verified {wanted}")
          print(f"{index} serves exactly the verified wheel: {served}")
          PY

  install:
    name: install check (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [build, testpypi]
    # ON A TAG, AFTER TestPyPI HOLDS THE WHEEL. On a branch, the rehearsal,
    # where the testpypi job is skipped, after the build alone, over the
    # build's own wheel.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      (needs.testpypi.result == 'success' ||
      (needs.testpypi.result == 'skipped' && !startsWith(github.ref, 'refs/tags/'))) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read  # the checkout, for the pipx lock alone
    # THREE LEGS, AND NO WINDOWS LEG (FR-032): ubuntu and macOS on a
    # current Python 3, and ubuntu on 3.9, the oldest Python the package
    # supports (`requires-python`). The package is bash, and has no native
    # Windows command.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.x'
          - os: macos-latest
            python: '3.x'
          - os: ubuntu-latest
            python: '3.9'
    env:
      WHEEL: ${{ needs.build.outputs.wheel }}
      WHEEL_SHA256: ${{ needs.build.outputs.wheel-sha256 }}
      DIGEST: ${{ needs.build.outputs.digest }}
      # EVERY pip THIS JOB RUNS, pipx's own included, reads PyPI and no
      # other index. The package has no dependency, and pipx's come from
      # its hash lock; TestPyPI, where anyone can upload, serves the one
      # file this job fetches by its recorded digest, and nothing else.
      PIP_INDEX_URL: https://pypi.org/simple/
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        id: python
        with:
          python-version: ${{ matrix.python }}

      # FROM TestPyPI, BY THE RECORDED DIGEST: the file TestPyPI lists under
      # the wheel's name, fetched from its file host, and kept only if its
      # sha256 is the one the build job recorded (the step after the next).
      - name: fetch the wheel from TestPyPI
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p "$RUNNER_TEMP/wheel"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 10 --retry-delay 15 --retry-all-errors \
              -o "$RUNNER_TEMP/testpypi.json" "https://test.pypi.org/pypi/openrepotools/$VERSION/json"
          url="$(python - "$RUNNER_TEMP/testpypi.json" <<'PY'
          import json, os, sys, urllib.parse
          with open(sys.argv[1], encoding="utf-8") as handle:
              files = json.load(handle)["urls"]
          entries = [f for f in files if f["filename"] == os.environ["WHEEL"]
                     and f["digests"]["sha256"] == os.environ["WHEEL_SHA256"]]
          if len(entries) != 1:
              sys.exit(f"TestPyPI lists {len(entries)} {os.environ['WHEEL']} at the recorded "
                       f"digest, not one: {files}")
          entry = entries[0]
          parts = urllib.parse.urlsplit(entry["url"])
          if parts.scheme != "https" or parts.hostname != "test-files.pythonhosted.org":
              sys.exit(f"TestPyPI lists the wheel at {entry['url']}, not on its own file host")
          print(entry["url"])
          PY
          )"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors \
              -o "$RUNNER_TEMP/wheel/$WHEEL" "$url"
          echo "fetched $url"

      # THE REHEARSAL: no upload was made, so the build's own wheel.
      - name: take the build's own wheel, on a branch (the rehearsal)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wheel
          path: ${{ runner.temp }}/wheel

      - name: the wheel is the one the build job verified
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, sys

          folder = pathlib.Path(os.environ["RUNNER_TEMP"]) / "wheel"
          found, wheel = sorted(p.name for p in folder.iterdir()), os.environ["WHEEL"]
          if found != [wheel]:
              sys.exit(f"::error::{folder} holds {found}, and the build job verified {wheel}")
          digest = hashlib.sha256((folder / wheel).read_bytes()).hexdigest()
          if digest != os.environ["WHEEL_SHA256"]:
              sys.exit(f"::error::{wheel} has sha256 {digest}, and the build job recorded "
                       f"{os.environ['WHEEL_SHA256']}; nothing from it is run")
          print(f"{wheel}: sha256 {digest}, the recorded digest")
          PY

      # pipx FROM ITS HASH LOCK, on this leg's Python: 1.11.1 on 3.9, the
      # newest pipx that installs there, and 1.17.8 from 3.10
      # (`.github/release-pipx-requirements.txt` says why). Its home and its
      # links are directories of this job's own, under the runner's temp,
      # as in `tests.yml`'s `package` job, and the steps below read them
      # through `$GITHUB_ENV`.
      - name: pipx from its hash lock, on this leg's Python
        run: |
          python -m pip install --only-binary :all: --require-hashes \
              -r .github/release-pipx-requirements.txt
          {
            echo "PIPX_HOME=$RUNNER_TEMP/pipx/home"
            echo "PIPX_BIN_DIR=$RUNNER_TEMP/pipx/bin"
          } >> "$GITHUB_ENV"
          python -m pipx --version

      # THE WHEEL INTO A FRESH ENVIRONMENT OF pipx's, as a person installs
      # it, wheels only. ONE COMMAND, SO ONE LINK: the package declares the
      # one console script `openRepoTools`, and pipx places that link and
      # nothing else.
      - name: pipx installs the wheel into a fresh environment, and places the one link openRepoTools
        env:
          PIPX_DEFAULT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          python -m pipx install --pip-args=--only-binary=:all: "$RUNNER_TEMP/wheel/$WHEEL"
          ls -l "$PIPX_BIN_DIR"
          placed="$(ls -A "$PIPX_BIN_DIR")"
          if [ "$placed" != openRepoTools ] || [ ! -L "$PIPX_BIN_DIR/openRepoTools" ]; then
            echo "::error::pipx placed '$placed' in $PIPX_BIN_DIR, and the package's one command is the link openRepoTools"
            exit 1
          fi

      # THE RELEASE THIS IS, LINE FOR LINE: the stamped package's five
      # lines, naming the run's repository, the version, its tag, the commit
      # and the digest the build recorded. On a branch these are the
      # build's own stamp values, which are the same five.
      - name: openRepoTools --version names this release, line for line
        run: |
          "$PIPX_BIN_DIR/openRepoTools" --version > "$RUNNER_TEMP/version.out" 2>&1
          printf '%s\n' \
              "openRepoTools $VERSION ($GITHUB_REPOSITORY @ $GITHUB_SHA)" \
              "  version   $VERSION" \
              "  tag       v$VERSION" \
              "  commit    $GITHUB_SHA" \
              "  digest    $DIGEST (sorted-ls-tree-r-v1)" > "$RUNNER_TEMP/version.want"
          if ! diff -u "$RUNNER_TEMP/version.want" "$RUNNER_TEMP/version.out"; then
            echo "::error::openRepoTools --version does not name $GITHUB_REPOSITORY, $VERSION, v$VERSION, $GITHUB_SHA and $DIGEST, line for line"
            exit 1
          fi
          cat "$RUNNER_TEMP/version.out"

      # OFFLINE, IN A HOME OF ITS OWN, BESIDE PIPX'S LINK, SET UP AS
      # `tests.yml`'s `package` job sets up its own (FR-016, FR-032): the two
      # scripts are one, line for line, but for the link's fingerprint, and
      # `tests/test_release_workflow.py` holds them so. `--install`, run
      # through the link, places the other sixteen commands, the skills and
      # the command files, leaves the link to pipx, and says so in the two
      # lines below, exactly. `env -i` hands it nothing of the runner's
      # environment but what is named on its line: a fresh HOME, the bin
      # directory pipx's link is in, a repository that cannot resolve, and a
      # PATH whose first directory holds a `gh` and a `curl` that both fail,
      # so anything that fetched would fail. The receipt has 28 rows, a full
      # install's 29 less the link, and the link is as pipx left it. The
      # link's fingerprint is taken by this leg's Python, because the macOS
      # leg's `stat` and `sha256sum` are not GNU's.
      - name: an offline --install beside pipx's link
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/install-home"
          offline="$RUNNER_TEMP/offline-bin"
          mkdir "$home" "$offline"
          for tool in gh curl; do
            printf '#!/bin/sh\necho "%s: this run is offline" >&2\nexit 1\n' "$tool" > "$offline/$tool"
            chmod 755 "$offline/$tool"
          done
          link="$PIPX_BIN_DIR/openRepoTools"
          fingerprint='import hashlib, os, sys; p = sys.argv[1]; print(os.lstat(p).st_ino, os.readlink(p), hashlib.sha256(open(p, "rb").read()).hexdigest())'
          before="$(python3 -I -c "$fingerprint" "$link")"
          status=0
          env -i HOME="$home" PATH="$offline:$PIPX_BIN_DIR:$PATH" \
              OPENREPOTOOLS_BIN_DIR="$PIPX_BIN_DIR" OPENREPOTOOLS_REPO=offline.invalid/sentinel \
              "$link" --install > "$RUNNER_TEMP/install.out" 2> "$RUNNER_TEMP/install.err" ||
              status=$?
          cat "$RUNNER_TEMP/install.out"
          cat "$RUNNER_TEMP/install.err" >&2
          if [ "$status" -ne 0 ]; then
            echo "::error::the offline --install exited $status"
            exit 1
          fi
          skip="openRepoTools: left to pipx at $link (a link into pipx's openrepotools environment); update it with \`pipx upgrade openrepotools\`, then run \`openRepoTools --install\` again"
          count="openRepoTools: 16 of 17 placed in $PIPX_BIN_DIR, and 1 left to pipx"
          for line in "$skip" "$count"; do
            seen="$(grep -cFx -e "$line" "$RUNNER_TEMP/install.out" || true)"
            if [ "$seen" -ne 1 ]; then
              echo "::error::--install printed this line $seen times, not once: $line"
              exit 1
            fi
          done
          receipt="$home/.local/share/openRepoTools/installed.tsv"
          if [ ! -f "$receipt" ]; then
            echo "::error::--install wrote no receipt at $receipt"
            exit 1
          fi
          rows="$(awk -F '\t' 'NF == 4' "$receipt" | wc -l)"
          lines="$(wc -l < "$receipt")"
          if [ "$rows" -ne 28 ] || [ "$lines" -ne 28 ]; then
            echo "::error::the receipt has $lines lines and $rows rows, not 28: a full install's 29 less pipx's link"
            exit 1
          fi
          if [ ! -L "$link" ] || [ "$(python3 -I -c "$fingerprint" "$link")" != "$before" ]; then
            echo "::error::--install changed pipx's link at $link"
            exit 1
          fi

      # ON macOS, THE SAME OFFLINE --install AGAIN UNDER APPLE'S OWN
      # `/bin/bash` 3.2 (FR-032), in a fresh home: `/bin` first on PATH, so
      # the bash the package's entry point finds there is `/bin/bash`. The
      # bash first on that same PATH prints its BASH_VERSION first, and it
      # must be 3.2. The skip line, the count line, the 28 rows and the link
      # must be as they were under the leg's own bash.
      - name: on macOS, the offline --install again under Apple's /bin/bash 3.2
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/install-home-bin-bash"
          offline="$RUNNER_TEMP/offline-bin-bin-bash"
          mkdir "$home" "$offline"
          for tool in gh curl; do
            printf '#!/bin/sh\necho "%s: this run is offline" >&2\nexit 1\n' "$tool" > "$offline/$tool"
            chmod 755 "$offline/$tool"
          done
          link="$PIPX_BIN_DIR/openRepoTools"
          fingerprint='import hashlib, os, sys; p = sys.argv[1]; print(os.lstat(p).st_ino, os.readlink(p), hashlib.sha256(open(p, "rb").read()).hexdigest())'
          before="$(python3 -I -c "$fingerprint" "$link")"
          # shellcheck disable=SC2016
          version="$(env -i PATH="/bin:$offline:$PIPX_BIN_DIR:$PATH" bash -c 'printf "%s\n" "$BASH_VERSION"')"
          echo "BASH_VERSION $version, from the bash first on PATH=/bin:..."
          case "$version" in
            3.2.*) ;;
            *)
              echo "::error::the bash first on a PATH that begins with /bin is $version, not Apple's 3.2"
              exit 1
              ;;
          esac
          status=0
          env -i HOME="$home" PATH="/bin:$offline:$PIPX_BIN_DIR:$PATH" \
              OPENREPOTOOLS_BIN_DIR="$PIPX_BIN_DIR" OPENREPOTOOLS_REPO=offline.invalid/sentinel \
              "$PIPX_BIN_DIR/openRepoTools" --install > "$RUNNER_TEMP/install-bin-bash.out" \
              2> "$RUNNER_TEMP/install-bin-bash.err" || status=$?
          cat "$RUNNER_TEMP/install-bin-bash.out"
          cat "$RUNNER_TEMP/install-bin-bash.err" >&2
          if [ "$status" -ne 0 ]; then
            echo "::error::the offline --install under /bin/bash $version exited $status"
            exit 1
          fi
          skip="openRepoTools: left to pipx at $link (a link into pipx's openrepotools environment); update it with \`pipx upgrade openrepotools\`, then run \`openRepoTools --install\` again"
          count="openRepoTools: 16 of 17 placed in $PIPX_BIN_DIR, and 1 left to pipx"
          for line in "$skip" "$count"; do
            seen="$(grep -cFx -e "$line" "$RUNNER_TEMP/install-bin-bash.out" || true)"
            if [ "$seen" -ne 1 ]; then
              echo "::error::--install under /bin/bash $version printed this line $seen times, not once: $line"
              exit 1
            fi
          done
          receipt="$home/.local/share/openRepoTools/installed.tsv"
          if [ ! -f "$receipt" ]; then
            echo "::error::--install under /bin/bash $version wrote no receipt at $receipt"
            exit 1
          fi
          rows="$(awk -F '\t' 'NF == 4' "$receipt" | wc -l)"
          lines="$(wc -l < "$receipt")"
          if [ "$rows" -ne 28 ] || [ "$lines" -ne 28 ]; then
            echo "::error::under /bin/bash $version the receipt has $lines lines and $rows rows, not 28"
            exit 1
          fi
          if [ ! -L "$link" ] || [ "$(python3 -I -c "$fingerprint" "$link")" != "$before" ]; then
            echo "::error::--install under /bin/bash $version changed pipx's link at $link"
            exit 1
          fi

      # ON PYTHON 3.9, THE SHIPPED BYTES COMPILE (FR-032): the two payload
      # commands written in Python, `lanes-index` and `lane-worktrees`, as
      # the installed package holds them under its own `payload/`, compiled
      # by this leg's python3, the oldest the package supports. Nothing is
      # written: `compile()` keeps no bytecode.
      - name: on Python 3.9, the installed payload's own lanes-index and lane-worktrees compile
        if: matrix.python == '3.9'
        run: |
          python3 -I - <<'PY'
          import glob, os, sys

          if sys.version_info[:2] != (3, 9):
              sys.exit(f"::error::this leg's python3 is {sys.version.split()[0]}, not 3.9")
          venv = os.path.join(os.environ["PIPX_HOME"], "venvs", "openrepotools")
          found = glob.glob(os.path.join(venv, "lib", "python*", "site-packages",
                                         "openrepotools", "payload"))
          if len(found) != 1:
              sys.exit(f"::error::pipx's openrepotools environment at {venv} holds {found}, "
                       "not one payload directory")
          problems = []
          for name in ("lanes-index", "lane-worktrees"):
              path = os.path.join(found[0], name)
              try:
                  with open(path, "rb") as handle:
                      compile(handle.read(), path, "exec")
              except (OSError, SyntaxError, ValueError) as error:
                  problems.append(f"{path} does not compile on Python 3.9: {error}")
              else:
                  print(f"{path}: compiles on Python {sys.version.split()[0]}")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

  pypi:
    name: publish to PyPI
    needs: [build, testpypi, install]
    # ON A v* TAG ONLY, ONLY FOR A FINAL FROM THE CODE LEG, and only after
    # TestPyPI and every leg of the install check passed: with no status
    # function in it, `if:` also requires every job above to have
    # succeeded. An expression cannot test a pattern, so the build's record
    # decides: `to-pypi` is `true` for a final X.Y.Z on a tag in
    # opensoft/openRepoTools-code alone (FR-048), so in an rc rehearsal
    # this job is skipped and never asks for the `pypi` approval.
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.to-pypi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/project/openrepotools/${{ inputs.version }}/
    permissions:
      id-token: write  # trusted publishing: the OIDC token PyPI accepts
      actions: read  # this environment's rules and this run's approvals
      contents: read  # the tag, read again
    env:
      WHEEL: ${{ needs.build.outputs.wheel }}
      WHEEL_SHA256: ${{ needs.build.outputs.wheel-sha256 }}
      INDEX: PyPI
      JSON_BASE: https://pypi.org/pypi/openrepotools/
    steps:
      # THE REPOSITORY GUARD AGAIN, ON ITS OWN, FIRST (FR-031, FR-048): PyPI
      # takes a final X.Y.Z from opensoft/openRepoTools-code, from its own
      # tag v<version>, and nothing else, ever. So in opensoft/openRepoTools
      # this step refuses outright, in case the job's condition is ever
      # loosened; that repository's missing pypi.org publisher is the second
      # line of defence.
      - name: the repository guard (FR-048) again, before anything else, and v<version> is a final from opensoft/openRepoTools-code
        run: |
          final='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$VERSION" =~ $final ]] || [ "$VERSION" = 0.0.0 ]; then
            echo "::error::PyPI takes a final release X.Y.Z alone, never a pre-release, so nothing is uploaded"
            printf 'the input, quoted: %q\n' "$VERSION"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "::error::an upload is made from the tag v$VERSION alone, and this run names '$GITHUB_REF', so nothing is uploaded"
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != opensoft/openRepoTools-code ]; then
            echo "::error::a release reaches PyPI from opensoft/openRepoTools-code alone, as GitHub spells it, and this run is in '$GITHUB_REPOSITORY', so nothing is uploaded"
            exit 1
          fi
          echo "opensoft/openRepoTools-code sends the final $VERSION to PyPI"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wheel
          path: dist

      - name: dist holds the wheel the build job verified, and nothing else
        run: |
          found="$(ls -A dist)"
          if [ "$found" != "$WHEEL" ]; then
            echo "::error::dist holds '$found', and the build job verified $WHEEL"
            exit 1
          fi
          echo "$WHEEL_SHA256  dist/$WHEEL" | sha256sum --strict -c -

      - name: this environment still asks a reviewer and admits only the tags v*, and this run's deployment to it was approved
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: pypi
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          repo, environment = os.environ["GITHUB_REPOSITORY"], os.environ["ENVIRONMENT"]


          def api(path):
              done = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if done.returncode != 0:
                  sys.exit(f"::error::`gh api {path}` failed, so nothing is uploaded: {done.stderr.strip()}")
              return json.loads(done.stdout)


          settings = api(f"repos/{repo}/environments/{environment}")
          reviewers = [rule for rule in settings.get("protection_rules") or []
                       if rule.get("type") == "required_reviewers" and rule.get("reviewers")]
          policy = settings.get("deployment_branch_policy") or {}
          limits = api(f"repos/{repo}/environments/{environment}/deployment-branch-policies?per_page=100")
          rules = sorted((p.get("type"), p.get("name")) for p in limits.get("branch_policies") or [])
          if not reviewers:
              sys.exit(f"::error::the {environment} environment names no required reviewer now")
          if policy.get("custom_branch_policies") is not True or rules != [("tag", "v*")]:
              sys.exit(f"::error::the {environment} environment's deployment limit is now {rules}, "
                       "not the one rule ('tag', 'v*'), so nothing is uploaded")
          approved = [review["user"]["login"]
                      for review in api(f"repos/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}/approvals")
                      if review.get("state") == "approved"
                      and any(e.get("name") == environment for e in review.get("environments") or [])]
          if not approved:
              sys.exit(f"::error::this run holds no approval of a deployment to {environment}, "
                       "so nothing is uploaded")
          print(f"{environment}: a reviewer, the tags v* alone, and approved by {', '.join(approved)}")
          PY

      - name: the tag v<version> still names this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" \
              --jq 'select(.object.type == "tag") | .object.sha')" || object=
          commit=
          if [ -n "$object" ]; then
            commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" \
                --jq 'select(.object.type == "commit") | .object.sha')" || commit=
          fi
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::the annotated tag v$VERSION no longer names $GITHUB_SHA (it names '$commit'), so nothing is uploaded"
            exit 1
          fi
          echo "v$VERSION still names $GITHUB_SHA"

      - name: the index holds no file of this version but the verified wheel
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          index, version = os.environ["INDEX"], os.environ["VERSION"]
          url = f"{os.environ['JSON_BASE']}{version}/json"
          wanted = {os.environ["WHEEL"]: os.environ["WHEEL_SHA256"]}
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print(f"{index} holds no file of openrepotools {version} yet")
              sys.exit(0)
          held = {f["filename"]: f["digests"]["sha256"] for f in release["urls"]}
          other = {name: digest for name, digest in held.items() if wanted.get(name) != digest}
          if other:
              sys.exit(f"::error::{index} already holds {other} for openrepotools {version}, "
                       "which the build job did not verify, so nothing is uploaded")
          yanked = sorted(f["filename"] for f in release["urls"] if f.get("yanked"))
          if yanked:
              sys.exit(f"::error::{index} holds {yanked} at the verified digest, but yanked; "
                       "un-yank it on the index, or release a new version")
          print(f"{index} holds {sorted(held)}, at the verified digest; skip-existing uploads nothing new")
          PY

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true
          print-hash: true

      # AFTER THE UPLOAD, PyPI SERVES EXACTLY THE VERIFIED DIGEST: the
      # bytes TestPyPI served and the install check ran.
      - name: the index serves exactly the verified wheel
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          index, version = os.environ["INDEX"], os.environ["VERSION"]
          url = f"{os.environ['JSON_BASE']}{version}/json"
          wanted = {os.environ["WHEEL"]: os.environ["WHEEL_SHA256"]}
          served = None
          for attempt in range(1, 21):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      release = json.load(response)
                  served = {f["filename"]: f["digests"]["sha256"] for f in release["urls"]}
                  if served == wanted:
                      if any(f.get("yanked") for f in release["urls"]):
                          sys.exit(f"::error::{index} serves the verified wheel, yanked")
                      break
                  print(f"read {attempt}: {index} serves {served} so far")
              except (urllib.error.URLError, TimeoutError, ConnectionError) as error:
                  code = getattr(error, "code", None)
                  if code is not None and code != 404 and code < 500:
                      raise
                  print(f"read {attempt}: {url} did not answer yet ({error})")
              time.sleep(15)
          else:
              sys.exit(f"::error::after 20 reads {index} serves {served}, and the build job "
                       f"verified {wanted}")
          print(f"{index} serves exactly the verified wheel: {served}")
          PY
