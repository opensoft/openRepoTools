name: tests

# The suite builds estates out of BARE REPOSITORIES IN A TEMPORARY DIRECTORY
# and clones them over the filesystem. It never calls `gh`, never touches the
# network, and must never create a real repository.
#
# THE SUITE RUNS ON LINUX ONLY. Brett Heap decided on 2026-10-15, for the
# whole estate, to take the macOS and Windows test jobs out of CI: `tests-macos`,
# `tests-windows` and the macOS bash-3.2 parse (`parse-macos`) are gone from this
# file, and what they checked is not checked anywhere in it now.
#
# EVERY CHECKOUT THAT RUNS THE SUITE TAKES `submodules: true`, `tests-no-submodule`
# excepted: it checks out `submodules: false` on purpose, to prove the skip path.
# The estate tests read eight of openRepoShape's own files out of
# `upstream/openRepoShape`, and `wip init`'s tests read the nine of
# `templates/workspace-root/`, all pinned by `contracts/openreposhape-pin.yaml`.
# Without them those tests SKIP rather than fail — which is what the
# `tests-no-submodule` job below proves on purpose, and what every suite job
# besides it must not be quietly doing.
#
# THE LANE HELPERS' OWN SUITE RUNS IN THESE JOBS TOO, and it runs because
# `tests/test_lane_helpers_suite.py` calls it: this repository's CI is
# pytest-only, so 196 KB of bash arriving at `tests/test_lane_helpers.sh` under
# lane-collision-protocol Amendment 9's move would otherwise have run in NO
# job. A suite nothing runs is not a suite (act 3, obligation 6). It is bash,
# and with macOS out of CI it runs under Linux's bash 5 only: no job here parses
# it under Apple's bash 3.2 any more.

# `pull_request` names `labeled` beside GitHub's own three defaults
# (`opened`, `synchronize`, `reopened`). It was put there so that the
# coordinator applying `ready` to an already-open PR would reach `tests-macos`'s
# `if:`; that job is gone, so no job here reads a label any more, and `labeled`
# stays as it was because this change touches no trigger. `on:` is shared by the
# whole workflow, so ANY label landing on a PR re-runs `guard-launch-mode`,
# `tests` and `tests-no-submodule`. `push` (main only) and the nightly
# `schedule` run those same three jobs. The cron is UTC.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'          # 04:17 UTC, nightly
  workflow_dispatch:

jobs:
  # Keep the process launch contract independently visible while the full
  # lane-helper suite runs. Each GitHub job has its own workstation runner;
  # the canonical wrapper still serializes any pytest processes on that runner.
  guard-launch-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'
      - name: install the test runner
        run: 'python3 -m pip install --disable-pip-version-check --only-binary=:all: pytest==8.3.4'
      - name: guard launch mode and repository hygiene
        env:
          GIT_AUTHOR_NAME: openRepoTools CI
          GIT_AUTHOR_EMAIL: ci@openrepotools.invalid
          GIT_COMMITTER_NAME: openRepoTools CI
          GIT_COMMITTER_EMAIL: ci@openrepotools.invalid
        run: bash tests/run.sh -k 'guard_launch_mode or repo_hygiene'

  tests:
    runs-on: ubuntu-latest
    steps:
      # PINNED BY COMMIT, not by tag — openRepoShape's own rule, and the same
      # two commits every job here pins. A tag can be moved and a commit
      # cannot, and three jobs resolving three versions of one action is
      # exactly the drift a pin exists to prevent.
      #
      # `fetch-depth: 1` is enough: nothing in this repository compares a
      # working-tree file against an older commit, which is what made
      # openRepoShape's own jobs need full history.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'

      # pytest is the TEST RUNNER and is the only thing installed here.
      # Nothing this repository ships needs a Python package: its commands are
      # bash, or `python3` (`lanes-index`, `lane-worktrees`) importing only the
      # standard library, and the suite itself imports only the standard
      # library.
      # PINNED. A CI job that resolves "latest" on every run is a job whose
      # result depends on the day it ran, which is the same objection this
      # family makes to pinning a tag instead of a commit.
      - name: install the test runner
        run: python3 -m pip install --disable-pip-version-check pytest==8.3.4

      # Per-invocation identity, never `git config --global`: a lane that
      # mirrors this step on a workstation must not be able to rewrite the
      # operator's ~/.gitconfig. The fixtures commit into throwaway
      # repositories and honour these variables.
      - name: git identity for the fixture commits (env, not global config)
        run: |
          {
            echo "GIT_AUTHOR_NAME=openRepoTools CI"
            echo "GIT_AUTHOR_EMAIL=ci@openrepotools.invalid"
            echo "GIT_COMMITTER_NAME=openRepoTools CI"
            echo "GIT_COMMITTER_EMAIL=ci@openrepotools.invalid"
          } >> "$GITHUB_ENV"

      - name: tests
        run: python3 -m pytest tests -q

  # THE SKIP PATH, PROVED. A fork's first command is `git clone` without
  # `--recurse-submodules` and then `pytest`, and if that goes RED the fork is
  # one nobody finishes. So one job checks out with NO submodules and asserts
  # the suite still exits 0: the estate tests skip, naming
  # `git submodule update --init upstream/openRepoShape`, and the hygiene and
  # installer tests — which need nothing but this repository — still run.
  #
  # `pytest -q` exits 0 on skips and 1 on failures, so the job's own status IS
  # the assertion; `-rs` prints the skip reasons, which is what a person
  # reading this job wants to see.
  tests-no-submodule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'

      - name: install the test runner
        run: python3 -m pip install --disable-pip-version-check pytest==8.3.4

      - name: the submodule really is not materialized
        run: |
          set -euo pipefail
          if [ -f upstream/openRepoShape/scripts/repo_shape.py ]; then
            echo "the submodule IS checked out; this job proves nothing" >&2
            exit 1
          fi

      - name: the suite skips rather than fails
        run: python3 -m pytest tests -q -rs
