name: tests

# The suite builds estates out of BARE REPOSITORIES IN A TEMPORARY DIRECTORY
# and clones them over the filesystem. It never calls `gh`, never touches the
# network, and must never create a real repository.
#
# THE SUITE RUNS ON LINUX ONLY. Brett Heap decided on 2026-10-15, for the
# whole estate, to take the macOS and Windows test jobs out of CI: `tests-macos`,
# `tests-windows` and the macOS bash-3.2 parse (`parse-macos`) are gone from this
# file, and what they checked is not checked anywhere in it now.
#
# EVERY CHECKOUT THAT RUNS THE SUITE TAKES `submodules: true`, `tests-no-submodule`
# excepted: it checks out `submodules: false` on purpose, to prove the skip path.
# The estate tests read eight of openRepoShape's own files out of
# `upstream/openRepoShape`, and `wip init`'s tests read the nine of
# `templates/workspace-root/`, all pinned by `contracts/openreposhape-pin.yaml`.
# Without them those tests SKIP rather than fail — which is what the
# `tests-no-submodule` job below proves on purpose, and what every suite job
# besides it must not be quietly doing.
#
# THE LANE HELPERS' OWN SUITE RUNS IN THESE JOBS TOO, and it runs because
# `tests/test_lane_helpers_suite.py` calls it: this repository's CI is
# pytest-only, so 196 KB of bash arriving at `tests/test_lane_helpers.sh` under
# lane-collision-protocol Amendment 9's move would otherwise have run in NO
# job. A suite nothing runs is not a suite (act 3, obligation 6). It is bash,
# and with macOS out of CI it runs under Linux's bash 5 only: no job here parses
# it under Apple's bash 3.2 any more.

# `pull_request` names `labeled` beside GitHub's own three defaults
# (`opened`, `synchronize`, `reopened`). It was put there so that the
# coordinator applying `ready` to an already-open PR would reach `tests-macos`'s
# `if:`; that job is gone, so no job here reads a label any more, and `labeled`
# stays as it was. `on:` is shared by the whole workflow and no job has an
# `if:`, so EVERY TRIGGER RUNS ALL FOUR JOBS, `guard-launch-mode`, `tests`,
# `tests-no-submodule` and `package`, and so does ANY label landing on a PR.
# `push` covers `main` and every `release/v*` branch (#228): the release
# workflow builds only a commit whose push or dispatch run of those four is
# green, and a patch release's commit is on its release branch, not on main.
# The nightly `schedule` and `workflow_dispatch` run the same four. The cron
# is UTC.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, 'release/v*']
  schedule:
    - cron: '17 4 * * *'          # 04:17 UTC, nightly
  workflow_dispatch:

jobs:
  # Keep the process launch contract independently visible while the full
  # lane-helper suite runs. Each GitHub job has its own workstation runner;
  # the canonical wrapper still serializes any pytest processes on that runner.
  guard-launch-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'
      - name: install the test runner
        run: 'python3 -m pip install --disable-pip-version-check --only-binary=:all: pytest==8.3.4'
      - name: guard launch mode and repository hygiene
        env:
          GIT_AUTHOR_NAME: openRepoTools CI
          GIT_AUTHOR_EMAIL: ci@openrepotools.invalid
          GIT_COMMITTER_NAME: openRepoTools CI
          GIT_COMMITTER_EMAIL: ci@openrepotools.invalid
        run: bash tests/run.sh -k 'guard_launch_mode or repo_hygiene'

  tests:
    runs-on: ubuntu-latest
    steps:
      # PINNED BY COMMIT, not by tag — openRepoShape's own rule, and the same
      # two commits every job here pins. A tag can be moved and a commit
      # cannot, and three jobs resolving three versions of one action is
      # exactly the drift a pin exists to prevent.
      #
      # `fetch-depth: 1` is enough: nothing in this repository compares a
      # working-tree file against an older commit, which is what made
      # openRepoShape's own jobs need full history.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'

      # pytest is the TEST RUNNER and is the only thing installed here.
      # Nothing this repository ships needs a Python package: its commands are
      # bash, or `python3` (`lanes-index`, `lane-worktrees`) importing only the
      # standard library, and the suite itself imports only the standard
      # library.
      # PINNED. A CI job that resolves "latest" on every run is a job whose
      # result depends on the day it ran, which is the same objection this
      # family makes to pinning a tag instead of a commit.
      - name: install the test runner
        run: python3 -m pip install --disable-pip-version-check pytest==8.3.4

      # Per-invocation identity, never `git config --global`: a lane that
      # mirrors this step on a workstation must not be able to rewrite the
      # operator's ~/.gitconfig. The fixtures commit into throwaway
      # repositories and honour these variables.
      - name: git identity for the fixture commits (env, not global config)
        run: |
          {
            echo "GIT_AUTHOR_NAME=openRepoTools CI"
            echo "GIT_AUTHOR_EMAIL=ci@openrepotools.invalid"
            echo "GIT_COMMITTER_NAME=openRepoTools CI"
            echo "GIT_COMMITTER_EMAIL=ci@openrepotools.invalid"
          } >> "$GITHUB_ENV"

      - name: tests
        run: python3 -m pytest tests -q

  # THE SKIP PATH, PROVED. A fork's first command is `git clone` without
  # `--recurse-submodules` and then `pytest`, and if that goes RED the fork is
  # one nobody finishes. So one job checks out with NO submodules and asserts
  # the suite still exits 0: the estate tests skip, naming
  # `git submodule update --init upstream/openRepoShape`, and the hygiene and
  # installer tests — which need nothing but this repository — still run.
  #
  # `pytest -q` exits 0 on skips and 1 on failures, so the job's own status IS
  # the assertion; `-rs` prints the skip reasons, which is what a person
  # reading this job wants to see.
  tests-no-submodule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'

      - name: install the test runner
        run: python3 -m pip install --disable-pip-version-check pytest==8.3.4

      - name: the submodule really is not materialized
        run: |
          set -euo pipefail
          if [ -f upstream/openRepoShape/scripts/repo_shape.py ]; then
            echo "the submodule IS checked out; this job proves nothing" >&2
            exit 1
          fi

      - name: the suite skips rather than fails
        run: python3 -m pytest tests -q -rs

  # THE openrepotools PACKAGE, BUILT, CHECKED AGAINST THIS COMMIT, INSTALLED
  # AS A PERSON INSTALLS IT AND TESTED (#228, contracts/workflows.md). The
  # release workflow builds only a commit whose push or dispatch run of all
  # four jobs here is green, so this job is where a commit proves it packages:
  #
  #   * the wheel, built twice at the commit's own time, is one file;
  #   * every file in it is the commit's own, the payload in mode as well as
  #     in bytes, and its `.dist-info` holds exactly five names, the commit's
  #     LICENSE among them;
  #   * pipx installs it, it says it is unstamped, and an offline `--install`
  #     run through pipx's link leaves that link to pipx;
  #   * the package's three test modules run against that wheel, and one
  #     test skipped among them fails the job (design.md Decision 9).
  #
  # UBUNTU, ON THE OLDEST PYTHON THE PACKAGE SUPPORTS, 3.9, as openRepoShape
  # v1.1.0's own `package` job, its model. tomli and pipx come by hash from
  # the two locks under `.github/`, and pytest at the pin the jobs above
  # install. The two builds reach PyPI for `pyproject.toml`'s pinned
  # hatchling and pipx reaches it for its shared pip; the `--install` run
  # reaches nothing.
  package:
    runs-on: ubuntu-latest
    steps:
      # The same two commits the other jobs pin.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.9'

      # The `tests` job's own step: per-invocation identity, never
      # `git config --global`, for the fixture commits the package's tests
      # make.
      - name: git identity for the fixture commits (env, not global config)
        run: |
          {
            echo "GIT_AUTHOR_NAME=openRepoTools CI"
            echo "GIT_AUTHOR_EMAIL=ci@openrepotools.invalid"
            echo "GIT_COMMITTER_NAME=openRepoTools CI"
            echo "GIT_COMMITTER_EMAIL=ci@openrepotools.invalid"
          } >> "$GITHUB_ENV"

      # THE TEST TOOLS, tomli FIRST AND BY HASH (research R12). The step copies
      # the build lock's whole tomli entry, its requirement line and every hash
      # line under it, into a file of its own and installs that, wheels only, so
      # this file holds no digest. Then, in the same step, pytest at the other
      # jobs' pin, which keeps that tomli: it meets pytest's own requirement
      # below Python 3.11. The pipx lock carries the same entry, and step 7,
      # after the two builds and the wheel check, installs that whole lock by
      # hash, so the package's tests (step 11), which on 3.9 read
      # `pyproject.toml` with tomli, run on the pipx lock's.
      - name: the test tools, tomli by hash from the build lock, then pytest
        run: |
          set -euo pipefail
          lock=.github/release-build-requirements.txt
          entry="$RUNNER_TEMP/tomli-requirements.txt"
          awk '/^tomli==/ { found = 1 } found { print; if ($0 !~ /\\$/) exit }' \
              "$lock" > "$entry"
          case "$(head -n 1 "$entry")" in
          tomli==*) ;;
          *)
            echo "::error::$lock has no tomli entry, and this job takes tomli from there alone"
            exit 1
            ;;
          esac
          if ! grep -q -e '--hash=' "$entry"; then
            echo "::error::$lock's tomli entry carries no hash"
            exit 1
          fi
          cat "$entry"
          python3 -m pip install --disable-pip-version-check --require-hashes \
              --only-binary=:all: -r "$entry"
          python3 -m pip install --disable-pip-version-check --only-binary=:all: \
              pytest==8.3.4

      # TWICE, AT THE COMMIT'S OWN TIME, AND THE TWO MUST BE ONE FILE, as the
      # release build requires of its own two (FR-030). `pip wheel` builds in
      # pip's isolated build environment, with `pyproject.toml`'s pinned
      # hatchling; `--no-deps`, because the package has no dependency to
      # build; `--no-cache-dir`, so neither build is a copy of the other.
      - name: build the wheel twice, and the two are one file
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python3 -m pip wheel --disable-pip-version-check --no-cache-dir --no-deps \
              -w "$RUNNER_TEMP/a" .
          python3 -m pip wheel --disable-pip-version-check --no-cache-dir --no-deps \
              -w "$RUNNER_TEMP/b" .
          for out in a b; do
            count="$(find "$RUNNER_TEMP/$out" -mindepth 1 -maxdepth 1 | wc -l)"
            built="$(find "$RUNNER_TEMP/$out" -mindepth 1 -maxdepth 1 -printf '%f\n')"
            if [ "$count" -ne 1 ] || [ "${built%.whl}" = "$built" ] ||
                [ ! -f "$RUNNER_TEMP/$out/$built" ]; then
              echo "::error::the build into $RUNNER_TEMP/$out left '$built', and a build is exactly one .whl"
              exit 1
            fi
          done
          wheel="$(find "$RUNNER_TEMP/a" -mindepth 1 -maxdepth 1 -printf '%f')"
          if [ "$(find "$RUNNER_TEMP/b" -mindepth 1 -maxdepth 1 -printf '%f')" != "$wheel" ] ||
              ! cmp "$RUNNER_TEMP/a/$wheel" "$RUNNER_TEMP/b/$wheel"; then
            echo "::error::two builds of $(git rev-parse HEAD) at SOURCE_DATE_EPOCH $SOURCE_DATE_EPOCH are not one file"
            exit 1
          fi
          sha256sum "$RUNNER_TEMP/a/$wheel" "$RUNNER_TEMP/b/$wheel"
          echo "PACKAGE_WHEEL=$RUNNER_TEMP/a/$wheel" >> "$GITHUB_ENV"

      # EVERY FILE IN THE WHEEL IS THE COMMIT'S OWN (contracts/wheel.md, checks
      # 2 to 6), read from git at HEAD and never from the checkout:
      #
      #   * each payload file of `pyproject.toml`'s force-include table is its
      #     blob, byte for byte, at mode 0755 where git records 100755 and 0644
      #     where it records 100644, which is how hatchling 1.27.0 writes them;
      #   * each module is its file under `src/openrepotools/`;
      #   * the stamp is the committed file, unchanged: this build is unstamped;
      #   * the `.dist-info` holds exactly its five names, LICENSE the commit's;
      #   * and nothing else is in the wheel.
      #
      # It names every problem, then fails if there was one. INLINE, as the
      # release build's own check is (research R13), and
      # `tests/test_tests_workflow.py` runs this heredoc on the wheels it makes
      # from HEAD's blobs: the wheel as built, three with one thing wrong, and
      # four more, one for each check those four never reach: a module, the
      # stamp, a member contracts/wheel.md does not list, and a member twice.
      - name: the wheel holds this commit's files, byte for byte and mode for mode
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP"/a/*.whl <<'PY'
          import re
          import subprocess
          import sys
          import zipfile

          try:
              import tomllib
          except ImportError:  # 3.9 and 3.10: the tomli installed by hash above
              import tomli as tomllib

          COMMIT = "HEAD"
          PACKAGE, PAYLOAD = "openrepotools/", "openrepotools/payload/"
          STAMP = "src/openrepotools/_release.py"


          def git(*args):
              return subprocess.run(["git", *args], capture_output=True,
                                    check=True).stdout


          def blob(path):
              return git("cat-file", "blob", f"{COMMIT}:{path}")


          if len(sys.argv) != 2:
              sys.exit("::error::the check reads the one wheel the first build left, "
                       f"and was given {sys.argv[1:]}")

          modes = {}
          for record in git("ls-tree", "-r", "-z", "--full-tree", COMMIT).split(b"\0"):
              if record:
                  meta, path = record.split(b"\t", 1)
                  mode, kind, _ = meta.decode("ascii").split(" ")
                  if kind == "blob":
                      modes[path.decode("utf-8")] = mode

          problems = []
          versions = re.findall(r'(?m)^VERSION = "([^"]*)"$', blob(STAMP).decode("utf-8"))
          if len(versions) != 1:
              sys.exit(f"::error::{STAMP} assigns VERSION {len(versions)} times at "
                       f"{COMMIT}, not once")
          info = f"openrepotools-{versions[0]}.dist-info/"

          # Each member the wheel must hold: the file at HEAD it is, or None for
          # one the build writes, and the mode a payload file must have.
          wanted = {}
          table = (tomllib.loads(blob("pyproject.toml").decode("utf-8"))
                   ["tool"]["hatch"]["build"]["targets"]["wheel"]["force-include"])
          for source, member in table.items():
              if member != PAYLOAD + source:
                  problems.append(f"pyproject.toml puts {source} at {member}, "
                                  f"not at {PAYLOAD}{source}")
              if modes.get(source) not in ("100755", "100644"):
                  problems.append(f"{source} is {modes.get(source, 'no file')} at "
                                  f"{COMMIT}, not a file the wheel can carry")
                  continue
              wanted[member] = (source, 0o755 if modes[source] == "100755" else 0o644)
          for path in modes:
              if re.fullmatch(r"src/openrepotools/[^/]+\.py", path):
                  wanted[PACKAGE + path.rsplit("/", 1)[1]] = (path, None)
          wanted[info + "licenses/LICENSE"] = ("LICENSE", None)
          for name in ("METADATA", "WHEEL", "RECORD", "entry_points.txt"):
              wanted[info + name] = (None, None)

          with zipfile.ZipFile(sys.argv[1]) as wheel:
              members = wheel.infolist()
              names = [member.filename for member in members]
              for name in sorted({name for name in names if names.count(name) > 1}):
                  problems.append(f"{name} is in the wheel more than once")
              for member in members:
                  name = member.filename
                  if name not in wanted:
                      problems.append(f"{name} is in the wheel, and is no member "
                                      "contracts/wheel.md lists")
                      continue
                  source, perm = wanted[name]
                  if source is None:
                      print(f"{name}: written by the build")
                      continue
                  what = "the committed stamp" if source == STAMP else source
                  if wheel.read(name) != blob(source):
                      problems.append(f"{name} in the wheel is not {what} at "
                                      f"{COMMIT}, byte for byte")
                      continue
                  if perm is None:
                      print(f"{name} = {COMMIT}:{source}")
                      continue
                  mode = member.external_attr >> 16
                  if mode & 0o777 != perm or mode & 0o170000 not in (0, 0o100000):
                      problems.append(f"{name} has mode {mode:o} in the wheel, and "
                                      f"{source} is {modes[source]} at {COMMIT}, "
                                      f"which is mode {perm:04o}")
                      continue
                  print(f"{name} = {COMMIT}:{source}, mode {perm:04o}")
          for name in sorted(set(wanted) - set(names)):
              problems.append(f"{name} is missing from the wheel")

          for problem in problems:
              print(f"::error::{problem}")
          print(f"{len(names)} members read against {COMMIT}: "
                f"{len(problems)} problem(s)")
          sys.exit(1 if problems else 0)
          PY

      # pipx ON THE 3.9 ABOVE, BY HASH: the lock gives 1.11.1 there, the newest
      # pipx that installs on 3.9 (`.github/release-pipx-requirements.txt`
      # says why). Its home and its links are directories of this job's own,
      # under the runner's temp, and the steps below read them through
      # `$GITHUB_ENV`.
      - name: pipx from its hash lock
        run: |
          set -euo pipefail
          {
            echo "PIPX_HOME=$RUNNER_TEMP/pipx/home"
            echo "PIPX_BIN_DIR=$RUNNER_TEMP/pipx/bin"
          } >> "$GITHUB_ENV"
          python3 -m pip install --disable-pip-version-check --require-hashes \
              --only-binary=:all: -r .github/release-pipx-requirements.txt
          python3 -m pipx --version

      # ONE COMMAND, SO ONE LINK: the package declares the one console script
      # `openRepoTools`, and pipx places that link and nothing else.
      - name: install the wheel with pipx
        run: |
          set -euo pipefail
          python3 -m pipx install "$PACKAGE_WHEEL"
          ls -l "$PIPX_BIN_DIR"
          placed="$(ls -A "$PIPX_BIN_DIR")"
          if [ "$placed" != openRepoTools ] || [ ! -L "$PIPX_BIN_DIR/openRepoTools" ]; then
            echo "::error::pipx placed '$placed' in $PIPX_BIN_DIR, and the package's one command is the link openRepoTools"
            exit 1
          fi

      # A BUILD FROM A CHECKOUT IS NOT A RELEASE, AND SAYS SO: the committed
      # stamp is unstamped, so `--version` prints contracts/cli-output.md's
      # five unstamped lines, and nothing else.
      - name: the unstamped --version, line for line
        run: |
          set -euo pipefail
          "$PIPX_BIN_DIR/openRepoTools" --version > "$RUNNER_TEMP/version.out" 2>&1
          cat > "$RUNNER_TEMP/version.want" <<'EOF'
          openRepoTools 0.0.0 (an unstamped package)
            version   0.0.0, unstamped: a package built from a checkout, not a release
            tag       none
            commit    none
            digest    none
          EOF
          diff -u "$RUNNER_TEMP/version.want" "$RUNNER_TEMP/version.out"

      # OFFLINE, IN A HOME OF ITS OWN, BESIDE PIPX'S LINK (research R14,
      # FR-016). `--install`, run through the link, places the other sixteen
      # commands, the skills and the command files, leaves the link to pipx,
      # and says so in the two lines below, exactly. `env -i` hands it nothing
      # of the runner's environment but what is named on its line: a fresh
      # HOME, the bin directory pipx's link is in, a repository that cannot
      # resolve, and a PATH whose first directory holds a `gh` and a `curl`
      # that both fail, so anything that fetched would fail. The hook pair is
      # deferred there, as in any home without `~/projects/xFactory/lanes-edit.sh`
      # (#237), and the run says so. The receipt has 28 rows, a full install's
      # 29 less the link, and the link is as pipx left it.
      - name: an offline --install beside pipx's link
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/install-home"
          offline="$RUNNER_TEMP/offline-bin"
          mkdir "$home" "$offline"
          for tool in gh curl; do
            printf '#!/bin/sh\necho "%s: this run is offline" >&2\nexit 1\n' "$tool" > "$offline/$tool"
            chmod 755 "$offline/$tool"
          done
          link="$PIPX_BIN_DIR/openRepoTools"
          before="$(stat -c %i "$link") $(readlink "$link") $(sha256sum < "$link")"
          status=0
          env -i HOME="$home" PATH="$offline:$PIPX_BIN_DIR:$PATH" \
              OPENREPOTOOLS_BIN_DIR="$PIPX_BIN_DIR" OPENREPOTOOLS_REPO=offline.invalid/sentinel \
              "$link" --install > "$RUNNER_TEMP/install.out" 2> "$RUNNER_TEMP/install.err" ||
              status=$?
          cat "$RUNNER_TEMP/install.out"
          cat "$RUNNER_TEMP/install.err" >&2
          if [ "$status" -ne 0 ]; then
            echo "::error::the offline --install exited $status"
            exit 1
          fi
          skip="openRepoTools: left to pipx at $link (a link into pipx's openrepotools environment); update it with \`pipx upgrade openrepotools\`, then run \`openRepoTools --install\` again"
          count="openRepoTools: 16 of 17 placed in $PIPX_BIN_DIR, and 1 left to pipx"
          for line in "$skip" "$count"; do
            seen="$(grep -cFx -e "$line" "$RUNNER_TEMP/install.out" || true)"
            if [ "$seen" -ne 1 ]; then
              echo "::error::--install printed this line $seen times, not once: $line"
              exit 1
            fi
          done
          receipt="$home/.local/share/openRepoTools/installed.tsv"
          if [ ! -f "$receipt" ]; then
            echo "::error::--install wrote no receipt at $receipt"
            exit 1
          fi
          rows="$(awk -F '\t' 'NF == 4' "$receipt" | wc -l)"
          lines="$(wc -l < "$receipt")"
          if [ "$rows" -ne 28 ] || [ "$lines" -ne 28 ]; then
            echo "::error::the receipt has $lines lines and $rows rows, not 28: a full install's 29 less pipx's link"
            exit 1
          fi
          if [ ! -L "$link" ] ||
              [ "$(stat -c %i "$link") $(readlink "$link") $(sha256sum < "$link")" != "$before" ]; then
            echo "::error::--install changed pipx's link at $link"
            exit 1
          fi

      # THE PACKAGE'S OWN TESTS, AGAINST THE WHEEL BUILT ABOVE (research R8):
      # `OPENREPOTOOLS_TEST_WHEEL` is what the built-wheel tests read, and
      # they skip without it, as they do in the `tests` job. The report is
      # read in the step after.
      - name: the package's tests, against the built wheel
        run: |
          set -euo pipefail
          export OPENREPOTOOLS_TEST_WHEEL="$PACKAGE_WHEEL"
          python3 -m pytest tests/test_package.py tests/test_package_stamp.py \
              tests/test_install_pipx.py -q -rs --junitxml="$RUNNER_TEMP/package-tests.xml"

      # A SKIP HERE IS A FAILURE (design.md Decision 9). `pytest -q` exits 0
      # on a skip, so the JUnit report is the enforcer: at least one test, and
      # none skipped, failed or in error.
      - name: the package's tests all ran, and none was skipped
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/package-tests.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ElementTree

          root = ElementTree.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          counts = {key: sum(int(suite.get(key, "0")) for suite in suites)
                    for key in ("tests", "skipped", "failures", "errors")}
          cases = list(root.iter("testcase"))
          marked = {key: sum(1 for case in cases if case.find(key) is not None)
                    for key in ("skipped", "failure", "error")}
          print(f"the report: {counts}; {len(cases)} test cases, of them {marked}")
          problems = []
          if counts["tests"] < 1 or not cases:
              problems.append("no test ran")
          for key in ("skipped", "failures", "errors"):
              if counts[key]:
                  problems.append(f"{counts[key]} {key}")
          for key, number in marked.items():
              if number:
                  problems.append(f"{number} test cases marked {key}")
          for problem in problems:
              print(f"::error::the package's tests: {problem}")
          sys.exit(1 if problems else 0)
          PY
